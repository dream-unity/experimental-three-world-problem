<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02040a" />
  <meta name="description" content="Dream Unity — three living 3D worlds of mind." />
  <title>Dream Unity</title>
  <link rel="stylesheet" href="./styles.css?v=20260824-4" />
</head>
<body>
  <main id="app" aria-label="Dream Unity interactive 3D simulation">
    <canvas id="world" aria-label="Interactive three-dimensional Dream Unity field"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="brand" id="brand"><i></i><span>DREAM UNITY</span></div>
    <div class="live"><i></i><span>LIVE</span></div>

    <button class="back" id="back" type="button" aria-label="Return to Dream Unity overview">
      <span>←</span><b>UNITY</b>
    </button>

    <div class="detail-title" id="detailTitle" aria-live="polite">
      <small id="detailNumber">01</small>
      <strong id="detailName">DREAM MACHINE</strong>
    </div>

    <button class="world-label" id="label-machine" data-world="machine" type="button">
      <span>01</span><strong>DREAM MACHINE</strong>
    </button>
    <button class="world-label" id="label-maker" data-world="maker" type="button">
      <span>02</span><strong>DREAM MAKER</strong>
    </button>
    <button class="world-label" id="label-reality" data-world="reality" type="button">
      <span>03</span><strong>DREAM WORLD</strong>
    </button>

    <div class="unity-label" id="unityLabel"><span></span><b>UNITY</b></div>

    <button class="sub-label" id="sub-0" type="button"><strong>PERCEIVE</strong></button>
    <button class="sub-label" id="sub-1" type="button"><strong>MODEL</strong></button>
    <button class="sub-label" id="sub-2" type="button"><strong>PREDICT</strong></button>

    <div class="hint" id="hint">TAP A WORLD</div>
    <div class="loading" id="loading"><span></span></div>
  </main>

  <noscript>This simulation requires JavaScript.</noscript>
  <script>
    // Loader fail-safe: the interface can never remain permanently covered.
    window.setTimeout(function () {
      var el = document.getElementById('loading');
      if (el) el.classList.add('hide');
    }, 1600);
  </script>
  <script src="./main.js?v=20260824-4"></script>
</body>
</html>
