<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05080d" />
  <meta name="description" content="God's Eye View inside Dream Unity." />
  <title>God's Eye View · Dream Unity</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#eef5ff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{display:grid;grid-template-rows:46px minmax(0,1fr)}
    .unity-shell{position:relative;z-index:10;height:46px;display:flex;align-items:center;gap:14px;padding:0 max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));border-bottom:1px solid rgba(255,255,255,.12);background:rgba(5,8,13,.97);box-shadow:0 8px 30px rgba(0,0,0,.18)}
    .return,.direct{height:30px;display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.16);background:transparent;color:#dce7f6;text-decoration:none;font-size:9px;font-weight:800;letter-spacing:.13em;white-space:nowrap;transition:border-color .16s ease,background .16s ease,color .16s ease}
    .return{padding:0 11px}.direct{margin-left:auto;padding:0 10px;color:#91a2b8}
    .return:hover,.return:focus-visible,.direct:hover,.direct:focus-visible{outline:none;border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.06);color:#fff}
    .identity{min-width:0;display:flex;align-items:baseline;gap:9px;white-space:nowrap}
    .identity strong{font-size:10px;letter-spacing:.18em}.identity small{font-size:7px;letter-spacing:.15em;color:#71839b;overflow:hidden;text-overflow:ellipsis}
    .viewport{position:relative;min-height:0;background:#05080d}
    .loading{position:absolute;inset:0;display:grid;place-items:center;color:#60748e;font-size:9px;font-weight:800;letter-spacing:.18em}
    iframe{position:absolute;z-index:2;inset:0;width:100%;height:100%;border:0;background:#05080d}
    @media(max-width:620px){
      body{grid-template-rows:42px minmax(0,1fr)}.unity-shell{height:42px;gap:8px}.return,.direct{height:28px;font-size:7px;padding-left:8px;padding-right:8px}.identity strong{font-size:8px}.identity small{display:none}
    }
  </style>
</head>
<body>
  <header class="unity-shell" aria-label="Dream Unity navigation">
    <a class="return" href="../" aria-label="Return to Dream Unity">← DREAM UNITY</a>
    <div class="identity"><strong>UNITY</strong><small>GOD'S EYE VIEW · PUBLIC INTELLIGENCE</small></div>
    <a class="direct" href="https://gods-eye-view-live.vercel.app" target="_blank" rel="noopener noreferrer">OPEN DIRECT</a>
  </header>
  <main class="viewport">
    <div class="loading" aria-hidden="true">CONNECTING GOD'S EYE VIEW…</div>
    <iframe
      src="https://gods-eye-view-live.vercel.app"
      title="God's Eye View"
      loading="eager"
      allow="autoplay; fullscreen; geolocation"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </main>
</body>
</html>
