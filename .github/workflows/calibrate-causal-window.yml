name: Calibrate Causal Interposition window

on:
  push:
    branches: [perceive-causal-relation-prototype]
    paths:
      - '.github/workflows/calibrate-causal-window.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: perceive-causal-relation-prototype
          fetch-depth: 0

      - name: Widen true relation windows and harden negative contrasts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('arcade-parts/perceive-aerial-02.txt')
          source = path.read_text(encoding='utf-8')
          replacements = {
              'let alongScale = 0.74 * jet.radialBias;': 'let alongScale = 0.62 * jet.radialBias;',
              "alongScale = 0.72;\n          perpendicularAmplitude = 0.16;\n          perpendicularBias = Math.sin(jet.phaseOffset) >= 0 ? 0.105 : -0.105;": "alongScale = 0.68;\n          perpendicularAmplitude = 0.07;\n          perpendicularBias = Math.sin(jet.phaseOffset) >= 0 ? 0.14 : -0.14;",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Expected calibration target was not found: {old!r}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate the complete nine-game runtime
        run: npm test

      - name: Commit calibrated gameplay source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arcade-parts/perceive-aerial-02.txt
          git commit -m 'Calibrate playable causal relation and contrast windows'
          git push origin HEAD:perceive-causal-relation-prototype
