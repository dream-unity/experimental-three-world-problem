name: Validate fluid whole-field orbit and verify live controls

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - main.js
      - interaction-recovery.css
      - visual-parts/part-05.txt
      - visual-parts/part-06.txt
      - visual-parts/interaction-recovery-22.txt
      - visual-parts/fluid-response-25.txt
      - tests/interaction-recovery.test.mjs
      - tests/rotation-stability.test.mjs
      - package.json
      - package-lock.json
      - .github/workflows/interaction-recovery.yml
  push:
    branches: [main]
    paths:
      - index.html
      - main.js
      - interaction-recovery.css
      - visual-parts/part-05.txt
      - visual-parts/part-06.txt
      - visual-parts/interaction-recovery-22.txt
      - visual-parts/fluid-response-25.txt
      - tests/interaction-recovery.test.mjs
      - tests/rotation-stability.test.mjs
      - package.json
      - package-lock.json
      - .github/workflows/interaction-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluid-whole-field-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate fluid controls and strictly decaying rotation
        run: |
          npm run test:interactions
          node tests/rotation-stability.test.mjs

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages stable-rotation source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(
            index.html
            main.js
            interaction-recovery.css
            visual-parts/part-05.txt
            visual-parts/part-06.txt
            visual-parts/interaction-recovery-22.txt
            visual-parts/fluid-response-25.txt
          )
          live_dir=$(mktemp -d)
          trap 'rm -rf "$live_dir"' EXIT
          mkdir -p "$live_dir/visual-parts"
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors --retry-delay 2 \
                "$PAGE_URL/$path?source=${GITHUB_SHA}&attempt=$attempt" \
                --output "$live_dir/$path" || matched=false
              if [ "$matched" = false ]; then break; fi
              cmp --silent "$path" "$live_dir/$path" || matched=false
              if [ "$matched" = false ]; then break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Stable rotation source has not propagated yet: attempt $attempt of 60"
            sleep 5
          done
          test "$matched" = true
          grep -q 'rot=29b' "$live_dir/index.html"
          grep -q "FLUID_RESPONSE_VERSION = '20260831-stable-rotation-29b'" "$live_dir/main.js"
          grep -q "IR_RELEASE = '20260831-fluid-whole-field-orbit-25'" "$live_dir/visual-parts/interaction-recovery-22.txt"
          grep -q "IR_FLUID_RESPONSE_RELEASE = '20260831-stable-rotation-29'" "$live_dir/visual-parts/fluid-response-25.txt"
          grep -q 'IR_INERTIA_DECAY = 3.25' "$live_dir/visual-parts/fluid-response-25.txt"
          grep -q 'acceleratesAfterRelease: false' "$live_dir/visual-parts/fluid-response-25.txt"
          grep -q 'autonomousRotation: false' "$live_dir/visual-parts/fluid-response-25.txt"
          ! grep -q 'Math.exp(dt \* 2.95)' "$live_dir/visual-parts/fluid-response-25.txt"
          ! grep -q 'irBaseUpdateMotion(dt)' "$live_dir/visual-parts/fluid-response-25.txt"
          grep -q 'overviewPitch = clamp(overviewPitch - dy \* pitchGain, -1.46, 1.46)' "$live_dir/visual-parts/part-06.txt"
          grep -q 'overviewPitch = clamp(pinchState.overviewPitch - midDy \* 0.0088, -1.46, 1.46)' "$live_dir/visual-parts/part-05.txt"
          grep -q 'trackpadYaw: 0.0072' "$live_dir/visual-parts/interaction-recovery-22.txt"
          ! grep -Eq 'irDeformations|connectedWorldCatmull|PATH BENDING WITH WORLD' "$live_dir/visual-parts/interaction-recovery-22.txt"
          grep -q 'z-index:10000!important' "$live_dir/interaction-recovery.css"
      - name: Exercise controls and prove rotation never accelerates on live Pages
        env:
          DU_INTERACTION_BASE_URL: https://dream-unity.github.io/experimental-three-world-problem/?source=${{ github.sha }}
        run: |
          npm run test:interactions
          node tests/rotation-stability.test.mjs
