name: Probe direct God's Eye View sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gev-direct-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Probe aircraft bridge candidates from Dream Unity origin
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/gods-eye-view/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto(process.env.PAGE_URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
            const target = 'https://gods-eye-view-live.vercel.app/api/aircraft?lat=-37.8136&lon=144.9631';
            const adsb = 'https://api.adsb.lol/v2/lat/-37.8136/lon/144.9631/dist/250';
            const sources = {
              radio_direct: 'https://de1.api.radio-browser.info/json/stations/search?hidebroken=true&limit=5&order=clickcount&reverse=true&has_geo_info=true',
              satellite_tleapi: 'https://tle.ivanstanojevic.me/api/tle?search=ISS&limit=5',
              aircraft_allorigins_vercel: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(target),
              aircraft_allorigins_adsb: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(adsb),
              aircraft_corsproxyio: 'https://corsproxy.io/?url=' + encodeURIComponent(target),
              aircraft_codetabs: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(target),
              aircraft_jina: 'https://r.jina.ai/' + target,
              aircraft_isomorphicgit: 'https://cors.isomorphic-git.org/' + target,
            };
            for (const [name, url] of Object.entries(sources)) {
              const result = await page.evaluate(async ({ name, url }) => {
                try {
                  const controller = new AbortController();
                  const timer = setTimeout(() => controller.abort(), 12000);
                  const response = await fetch(url, { cache: 'no-store', signal: controller.signal });
                  clearTimeout(timer);
                  const text = await response.text();
                  return { name, ok: response.ok, status: response.status, bytes: text.length, sample: text.slice(0, 180) };
                } catch (error) {
                  return { name, ok: false, error: String(error) };
                }
              }, { name, url });
              console.log('SOURCE', JSON.stringify(result));
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
