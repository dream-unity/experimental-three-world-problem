name: God's Eye View free-host smoke test

on:
  push:
    branches:
      - cloudrun-gods-eye-view
    paths:
      - 'cloudrun-gods-eye-view/**'
      - 'render.yaml'
      - '.github/workflows/gev-cloudrun-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out deployment wrapper
        uses: actions/checkout@v4

      - name: Build the container
        run: docker build --pull --tag gev-free ./cloudrun-gods-eye-view

      - name: Start within Render Free memory limit
        run: |
          docker run --detach --name gev-free-test \
            --memory=512m \
            --memory-swap=512m \
            --publish 8080:8080 \
            --env PORT=8080 \
            gev-free

      - name: Wait for the real app server
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ > /tmp/gev-index.html; then
              break
            fi
            if ! docker inspect --format='{{.State.Running}}' gev-free-test | grep -q true; then
              docker logs gev-free-test
              exit 1
            fi
            sleep 2
          done
          grep -q "God's Eye View" /tmp/gev-index.html

      - name: Verify viewport-scoped live aircraft
        run: |
          curl --fail --silent --show-error \
            --dump-header /tmp/flight-headers \
            --output /tmp/flight-body \
            'http://127.0.0.1:8080/api/opensky?lat=-37.8136&lon=144.9631'
          grep -qi '^X-Flight-Source: adsb.lol' /tmp/flight-headers
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/flight-body','utf8')); if(!Array.isArray(d.states)) process.exit(1); console.log('Melbourne live aircraft:', d.states.length)"

      - name: Soak live aircraft across four regions
        run: |
          for point in \
            '-37.8136,144.9631' \
            '50.4501,30.5234' \
            '30.2672,-97.7431' \
            '31.2304,121.4737'; do
            lat="${point%,*}"
            lon="${point#*,}"
            curl --fail --silent --show-error \
              "http://127.0.0.1:8080/api/opensky?lat=${lat}&lon=${lon}" \
              > /tmp/region.json
            LAT="$lat" LON="$lon" node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/region.json','utf8')); if(!Array.isArray(d.states)) process.exit(1); console.log(process.env.LAT+','+process.env.LON+': '+d.states.length+' live aircraft')"
            sleep 2
          done
          test "$(docker inspect --format='{{.State.Running}}' gev-free-test)" = true

      - name: Verify live satellite catalog
        run: |
          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/api/celestrak/stations' \
            > /tmp/stations.tle
          test -s /tmp/stations.tle
          grep -qi 'ISS' /tmp/stations.tle

      - name: Verify world radio directory
        run: |
          curl --fail --silent --show-error \
            'http://127.0.0.1:8080/api/radio/stations' \
            > /tmp/radio.json
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('/tmp/radio.json','utf8'));"
          test "$(wc -c < /tmp/radio.json)" -gt 100

      - name: Confirm free-host memory headroom
        run: |
          test "$(docker inspect --format='{{.State.Running}}' gev-free-test)" = true
          docker stats --no-stream gev-free-test

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker stats --no-stream gev-free-test || true
          docker logs gev-free-test || true

      - name: Stop container
        if: always()
        run: docker rm --force gev-free-test || true
