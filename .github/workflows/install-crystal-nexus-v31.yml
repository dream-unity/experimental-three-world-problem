            addEventListener('resize',()=>{resize();render()},{passive:true});document.addEventListener('visibilitychange',()=>{last=performance.now()});
            function animate(now){const dt=Math.min(.04,Math.max(0,(now-last)/1000));last=now;if(!document.hidden&&!window.__dreamUnityGameActive){time+=dt;if(!pointers.size){yaw+=yawV*dt;pitch=clamp(pitch+pitchV*dt,-1.34,1.34);roll=clamp(roll+rollV*dt,-.9,.9);const decay=Math.exp(-dt*3.4);yawV*=decay;pitchV*=decay;rollV*=decay;if(Math.abs(yawV)<.002)yawV=0;if(Math.abs(pitchV)<.002)pitchV=0;if(Math.abs(rollV)<.002)rollV=0}render();frame++}requestAnimationFrame(animate)}
            resize();render();loading?.classList.add('hide');app.dataset.renderer='crystal-nexus';app.dataset.rendererVersion='20260901-crystal-nexus-31';
            window.__dreamUnityNexus=Object.freeze({ready:true,version:'20260901-crystal-nexus-31',orientation:()=>({yaw,pitch,roll,zoom,yawVelocity:yawV,pitchVelocity:pitchV}),portals:()=>structuredClone(screen),reset:()=>{yaw=.16;pitch=-.08;roll=0;zoom=1;yawV=pitchV=rollV=0;render()},integrity:()=>({connected:true,rigid:true,finite:Object.values(screen).every(p=>[p.x,p.y,p.r,p.z].every(Number.isFinite))})});
            requestAnimationFrame(animate);
          })();
          JS_EOF

      - name: Replace obsolete homepage validation with Crystal Nexus verification
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/crystal-nexus.test.mjs <<'STATIC_EOF'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,statSync,existsSync} from 'node:fs';
          const read=p=>readFileSync(new URL(`../${p}`,import.meta.url),'utf8');
          for(const p of ['index.html','nexus.css','main.js','unity-ui.js','arcade.js','assets/dream-maker-eye.mp3','assets/crystal-horizon.webp'])assert.ok(existsSync(new URL(`../${p}`,import.meta.url)),`${p} missing`);
          const index=read('index.html'),main=read('main.js'),ui=read('unity-ui.js'),css=read('nexus.css'),arcade=[1,2,3,4,5].map(n=>read(`arcade-parts/part-${String(n).padStart(2,'0')}.txt`)).join('\n');
          assert.match(index,/Crystal Nexus/);assert.match(index,/assets\/dream-maker-eye\.mp3/);assert.match(index,/nexus\.css\?v=20260901-crystal-nexus-31/);assert.doesNotMatch(index,/i-remember-tomorrow|AWAKEN THE TRUE WAR/);
          for(const marker of ['__dreamUnityNexus','drawCelestialSphere','drawCrystal','drawPortal','drawThreads','dreamunity:launch-game'])assert.ok(main.includes(marker),marker);
          for(const marker of ['__dreamUnityScore','createMediaElementSource','createAnalyser','Dream Maker Eye'])assert.ok(ui.includes(marker),marker);
          for(const marker of ['.nexus-atmosphere','.world-label','.arcade.open','.game-bar'])assert.ok(css.includes(marker),marker);
          for(const name of ['FIGHTER JET','MODEL FORGE','ORACLE GATES','VECTOR VOW','IMPULSE RUN','BECOME','GRAVITY FOUNDRY','LATTICE LOCK','GENESIS BLOOM'])assert.ok(arcade.includes(name),`${name} missing`);
          assert.ok(statSync(new URL('../assets/dream-maker-eye.mp3',import.meta.url)).size>1000000);assert.ok(statSync(new URL('../assets/crystal-horizon.webp',import.meta.url)).size>50000);
          execFileSync(process.execPath,['--check',new URL('../main.js',import.meta.url).pathname],{stdio:'inherit'});execFileSync(process.execPath,['--check',new URL('../unity-ui.js',import.meta.url).pathname],{stdio:'inherit'});
          console.log('Crystal Nexus static contracts validated.');
          STATIC_EOF

          cat > tests/crystal-nexus-browser.test.mjs <<'BROWSER_EOF'
          import assert from 'node:assert/strict';import {createServer} from 'node:http';import {readFile,stat,mkdir} from 'node:fs/promises';import {extname,join,normalize} from 'node:path';import {chromium} from 'playwright';
          const root=normalize(new URL('../',import.meta.url).pathname),mime={'.html':'text/html','.css':'text/css','.js':'text/javascript','.txt':'text/plain','.mp3':'audio/mpeg','.webp':'image/webp'};let server=null,base=process.env.DU_NEXUS_BASE_URL||'';
          if(!base){server=createServer(async(req,res)=>{try{const u=new URL(req.url,'http://x'),rel=decodeURIComponent(u.pathname==='/'?'/index.html':u.pathname),file=normalize(join(root,rel));assert.ok(file.startsWith(root));assert.ok((await stat(file)).isFile());res.writeHead(200,{'Content-Type':mime[extname(file)]||'application/octet-stream','Cache-Control':'no-store'});res.end(await readFile(file))}catch{res.writeHead(404).end('Not found')}});await new Promise((r,j)=>{server.once('error',j);server.listen(0,'127.0.0.1',r)});base=`http://127.0.0.1:${server.address().port}`}
          const browser=await chromium.launch({headless:true}),errors=[];async function open(opts){const context=await browser.newContext(opts);const page=await context.newPage();page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await page.addInitScript(()=>localStorage.setItem('dream-unity-dream-maker-eye-muted','1'));const u=new URL(base);u.searchParams.set('nexus-check',Date.now());await page.goto(u.href,{waitUntil:'networkidle'});await page.waitForFunction(()=>window.__dreamUnityNexus?.ready===true);await page.waitForFunction(()=>Object.values(window.__dreamUnityNexus.portals()).every(p=>p.r>25));return{context,page}}
          const {context,page}=await open({viewport:{width:1536,height:864},deviceScaleFactor:1.5});assert.equal(await page.locator('#app').getAttribute('data-renderer'),'crystal-nexus');for(const id of ['label-machine','label-maker','label-reality','scoreControl'])await page.locator(`#${id}`).waitFor({state:'visible'});const before=await page.evaluate(()=>window.__dreamUnityNexus.orientation());await page.mouse.move(770,430);await page.mouse.down();await page.mouse.move(850,474,{steps:8});await page.mouse.up();const released=await page.evaluate(()=>window.__dreamUnityNexus.orientation());assert.ok(Math.abs(released.yaw-before.yaw)+Math.abs(released.pitch-before.pitch)>.35);await page.waitForTimeout(180);const one=await page.evaluate(()=>window.__dreamUnityNexus.orientation());await page.waitForTimeout(180);const two=await page.evaluate(()=>window.__dreamUnityNexus.orientation());const d1=Math.hypot(one.yaw-released.yaw,one.pitch-released.pitch),d2=Math.hypot(two.yaw-one.yaw,two.pitch-one.pitch);assert.ok(d2<=d1*1.08+.002,`rotation accelerated ${d1} -> ${d2}`);assert.equal((await page.evaluate(()=>window.__dreamUnityNexus.integrity())).finite,true);
          for(const key of ['machine','maker','reality']){await page.evaluate(k=>document.querySelector(`#label-${k}`)?.click(),key);await page.waitForFunction(()=>document.querySelector('#app')?.classList.contains('detail'));for(let i=0;i<3;i++){await page.evaluate(({k,i})=>window.dispatchEvent(new CustomEvent('dreamunity:launch-game',{detail:{world:k,index:i}})),{k:key,i});await page.locator('#arcade.open').waitFor();for(const id of ['gameBack','gameSound','gamePause','gameRestart'])await page.locator(`#${id}`).waitFor({state:'visible'});await page.locator('#gameBack').click();await page.waitForFunction(()=>!document.querySelector('#arcade')?.classList.contains('open'))}await page.locator('#back').click();await page.waitForFunction(()=>!document.querySelector('#app')?.classList.contains('detail'))}
          const out=process.env.DU_NEXUS_SCREENSHOT_DIR;if(out){await mkdir(out,{recursive:true});await page.screenshot({path:join(out,'crystal-nexus-desktop.png'),fullPage:true})}await context.close();const mobile=await open({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});if(out)await mobile.page.screenshot({path:join(out,'crystal-nexus-mobile.png'),fullPage:true});assert.ok(await mobile.page.locator('#world').evaluate(n=>n.getBoundingClientRect().width>=389));await mobile.context.close();assert.deepEqual(errors,[]);await browser.close();if(server)await new Promise(r=>server.close(r));console.log(`Crystal Nexus browser validation passed${process.env.DU_NEXUS_BASE_URL?' live':''}.`);
          BROWSER_EOF

          cat > package.json <<'PACKAGE_EOF'
          {
            "name":"dream-unity-experimental-three-world-problem",
            "version":"2.0.0",
            "private":true,
            "type":"module",
            "description":"Dream Unity Crystal Nexus with Dream Maker Eye score and nine compatible games.",
            "scripts":{"test":"node tests/crystal-nexus.test.mjs && node tests/role-drift.test.mjs","test:browser":"node tests/crystal-nexus-browser.test.mjs","test:all":"npm test && npm run test:browser"},
            "devDependencies":{"playwright":"^1.62.1"},
            "engines":{"node":">=20"}
          }
          PACKAGE_EOF
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package-lock.json'));p.name='dream-unity-experimental-three-world-problem';p.version='2.0.0';p.packages[''].name=p.name;p.packages[''].version=p.version;fs.writeFileSync('package-lock.json',JSON.stringify(p,null,2)+'\n')"

          rm -f tests/remembered-tomorrow.test.mjs tests/interaction-recovery.test.mjs tests/world-emblems.test.mjs tests/browser-regression.mjs
          rm -rf visual-parts
          rm -f styles.css unity-cycle.css interaction-recovery.css assets/i-remember-tomorrow.mp3
          rm -f .github/workflows/interaction-recovery.yml .github/workflows/world-emblems.yml .github/workflows/validate-and-verify.yml

          cat > .github/workflows/validate-and-verify.yml <<'WORKFLOW_EOF'
          name: Validate Crystal Nexus and verify live Pages
          on:
            push:
              branches: [main]
              paths-ignore: ['DEPLOYMENT_STATUS.json']
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          concurrency:
            group: crystal-nexus-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true
          jobs:
            validate:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
                  with: {persist-credentials: false}
                - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
                  with: {node-version: '24.19.0', cache: npm}
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - name: Validate Crystal Nexus, Dream Maker Eye and nine games
                  env: {DU_NEXUS_SCREENSHOT_DIR: nexus-artifacts}
                  run: npm run test:all
                - if: always()
                  uses: actions/upload-artifact@v4
                  with: {name: 'crystal-nexus-${{ github.sha }}', path: nexus-artifacts, if-no-files-found: warn, retention-days: 14}
            verify-live:
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              needs: validate
              runs-on: ubuntu-latest
              timeout-minutes: 18
              steps:
                - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
                  with: {ref: '${{ github.sha }}', persist-credentials: false}
                - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
                  with: {node-version: '24.19.0', cache: npm}
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - name: Wait for exact GitHub Pages propagation
                  shell: bash
                  env: {PAGE_URL: 'https://dream-unity.github.io/experimental-three-world-problem'}
                  run: |
                    set -euo pipefail
                    files=(index.html nexus.css main.js unity-ui.js arcade.js become.css light-theme.js assets/dream-maker-eye.mp3 assets/crystal-horizon.webp)
                    dir=$(mktemp -d);trap 'rm -rf "$dir"' EXIT;mkdir -p "$dir/assets";ready=false
                    for attempt in $(seq 1 60);do ready=true;for path in "${files[@]}";do curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 "$PAGE_URL/$path?source=${GITHUB_SHA}&attempt=$attempt" -o "$dir/$path"||{ ready=false;break;};cmp --silent "$path" "$dir/$path"||{ ready=false;break;};done;[ "$ready" = true ]&&break;sleep 5;done
                    test "$ready" = true
                    grep -q '20260901-crystal-nexus-31' "$dir/index.html"
                    grep -q 'assets/dream-maker-eye.mp3' "$dir/index.html"
                - name: Exercise the deployed Crystal Nexus and all nine games
                  env: {DU_NEXUS_BASE_URL: 'https://dream-unity.github.io/experimental-three-world-problem/?source=${{ github.sha }}'}
                  run: npm run test:browser
          WORKFLOW_EOF

      - name: Commit the replacement atomically
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-crystal-nexus-v31.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install the Crystal Nexus and Dream Maker Eye score'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
