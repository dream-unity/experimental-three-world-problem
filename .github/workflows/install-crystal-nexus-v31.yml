name: Install Crystal Nexus v31

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-crystal-nexus-v31.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-crystal-nexus-v31
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Recover the prepared Dream Maker Eye and crystalline horizon blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/crystal-blobs assets
          shas=(
            bf19be2596444b189220bd13758e1413d79039da
            2c81d55e0f8c91f0bb1a63a056769f432d2390a9
            4060d0784a75bbdc3861321b3c9b0798a955fd45
            74e22a3fb8cb13de75f5ac9c1234a5293f01ff6a
          )
          for sha in "${shas[@]}"; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              | jq -r '.content' | tr -d '\n' | base64 --decode > "/tmp/crystal-blobs/$sha"
          done

          audio=''
          horizon=''
          for candidate in /tmp/crystal-blobs/*; do
            mime=$(file --brief --mime-type "$candidate")
            case "$mime" in
              audio/mpeg|audio/mp3)
                if [ -z "$audio" ] || [ "$(stat -c%s "$candidate")" -gt "$(stat -c%s "$audio")" ]; then audio="$candidate"; fi
                ;;
              image/webp)
                if [ -z "$horizon" ] || [ "$(stat -c%s "$candidate")" -gt "$(stat -c%s "$horizon")" ]; then horizon="$candidate"; fi
                ;;
            esac
          done
          test -n "$audio"
          test -n "$horizon"
          test "$(stat -c%s "$audio")" -gt 1000000
          test "$(stat -c%s "$horizon")" -gt 50000
          cp "$audio" assets/dream-maker-eye.mp3
          cp "$horizon" assets/crystal-horizon.webp
          file assets/dream-maker-eye.mp3 assets/crystal-horizon.webp

      - name: Write the Crystal Nexus page
        shell: bash
        run: |
          set -euo pipefail
          cat > index.html <<'HTML_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
            <meta name="theme-color" content="#f7f8fc" />
            <meta name="color-scheme" content="light" />
            <meta name="description" content="Dream Unity — the Crystal Nexus of Dream Machine, Dream Maker and Dream World." />
            <title>Dream Unity — Crystal Nexus</title>
            <link rel="stylesheet" href="./nexus.css?v=20260901-crystal-nexus-31" />
            <link rel="stylesheet" href="./become.css?v=20260831" />
          </head>
          <body>
            <main id="app" aria-label="Dream Unity Crystal Nexus">
              <div class="nexus-atmosphere" aria-hidden="true"></div>
              <canvas id="world" aria-label="Interactive Crystal Nexus. Drag to orbit, pinch to zoom, and select a portal."></canvas>
              <audio id="scoreAudio" src="./assets/dream-maker-eye.mp3" preload="metadata" autoplay loop></audio>

              <header class="brand" aria-label="Dream Unity"><i aria-hidden="true"></i><span>DREAM UNITY</span><small>THE CRYSTAL NEXUS</small></header>
              <button class="score-control" id="scoreControl" type="button" aria-label="Turn Dream Unity music off" aria-pressed="true">
                <span class="score-mark" aria-hidden="true"><i></i><i></i><i></i></span><small>MUSIC</small><b id="scoreState">LOADING</b>
              </button>

              <div class="nexus-title" id="nexusTitle" aria-hidden="true"><strong>DREAM<br />UNITY</strong><small>THE NEXUS OF ALL POSSIBILITIES</small></div>

              <button class="world-label machine" id="label-machine" data-world="machine" type="button" aria-label="Enter Dream Machine: Perceive, Model, Predict">
                <span class="portal-number">01</span><span class="portal-diamond" aria-hidden="true"></span><span class="world-copy"><strong>DREAM MACHINE</strong><small>PERCEIVE · MODEL · PREDICT</small></span>
              </button>
              <button class="world-label maker" id="label-maker" data-world="maker" type="button" aria-label="Enter Dream Maker: Intend, Act, Design">
                <span class="portal-number">02</span><span class="portal-diamond" aria-hidden="true"></span><span class="world-copy"><strong>DREAM MAKER</strong><small>INTEND · ACT · DESIGN</small></span>
              </button>
              <button class="world-label reality" id="label-reality" data-world="reality" type="button" aria-label="Enter Dream World: Material, Structure, Experience">
                <span class="portal-number">03</span><span class="portal-diamond" aria-hidden="true"></span><span class="world-copy"><strong>DREAM WORLD</strong><small>MATERIAL · STRUCTURE · EXPERIENCE</small></span>
              </button>

              <button class="back" id="back" type="button" aria-label="Return to Crystal Nexus"><span>←</span><b>NEXUS</b></button>
              <div class="detail-title" id="detailTitle" aria-live="polite"><small id="detailNumber">01</small><strong id="detailName">DREAM MACHINE</strong></div>
              <button class="sub-label" id="sub-0" type="button"><strong>PERCEIVE</strong></button>
              <button class="sub-label" id="sub-1" type="button"><strong>MODEL</strong></button>
              <button class="sub-label" id="sub-2" type="button"><strong>PREDICT</strong></button>
              <div class="loading" id="loading" role="status" aria-label="Forming Crystal Nexus"><span></span></div>

              <section class="arcade" id="arcade" aria-hidden="true" aria-label="Dream Unity arcade">
                <canvas id="gameCanvas" aria-label="Playable Dream Unity game"></canvas>
                <div class="game-vignette" aria-hidden="true"></div>
                <header class="game-bar">
                  <button class="game-icon" id="gameBack" type="button" aria-label="Return to current world">←</button>
                  <div class="game-heading"><small id="gameWorld">01 · DREAM MACHINE</small><strong id="gameName">FIGHTER JET</strong></div>
                  <div class="game-readout"><span><small>SCORE</small><b id="gameScore">0</b></span><span><small>BEST</small><b id="gameBest">0</b></span><span class="game-metric"><small id="gameMetricLabel">SHIELD</small><b id="gameMetric">5 · ×0</b></span></div>
                  <button class="game-icon" id="gameSound" type="button" aria-label="Toggle game sound">♪</button>
                  <button class="game-icon" id="gamePause" type="button" aria-label="Pause game">Ⅱ</button>
                  <button class="game-icon" id="gameRestart" type="button" aria-label="Restart game">↻</button>
                </header>
                <div class="game-card" id="gameCard"><div class="game-glyph" id="gameGlyph">✦</div><small id="gameDomain">PERCEIVE</small><h1 id="gameCardTitle">FIGHTER JET</h1><p id="gameRule">Infer the hidden rule, then act inside a changing system.</p><button id="gameStart" type="button">ENTER</button></div>
                <div class="game-state" id="gameState" aria-live="polite"><strong id="gameStateTitle">PAUSED</strong><small id="gameStateCopy">TAP TO CONTINUE</small><button id="gameAgain" type="button">CONTINUE</button></div>
                <div class="game-toast" id="gameToast"></div>
                <div class="game-hint" id="gameHint">OBSERVE · INTEGRATE · COMMIT</div>
                <section class="become-lab" id="becomeLab" aria-hidden="true" aria-label="Become training lab"><div class="become-viewport"><div class="become-screen" id="becomeScreen" aria-live="polite"></div></div></section>
              </section>
            </main>
            <noscript>This experience requires JavaScript.</noscript>
            <script>window.setTimeout(function(){document.getElementById('loading')?.classList.add('hide')},2600);</script>
            <script src="./light-theme.js?v=20260830-awaken-true-war-3"></script>
            <script src="./unity-ui.js?v=20260901-dream-maker-eye-31"></script>
            <script src="./main.js?v=20260901-crystal-nexus-31"></script>
            <script src="./arcade.js?v=20260827-fighter-jet-performance-20"></script>
          </body>
          </html>
          HTML_EOF

          cat > nexus.css <<'CSS_EOF'
