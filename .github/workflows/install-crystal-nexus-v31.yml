          .world-label{--portal:var(--machine);position:absolute;z-index:35;min-width:clamp(178px,17vw,278px);height:clamp(72px,8.4vh,98px);padding:0 clamp(20px,2vw,34px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;border:1px solid color-mix(in srgb,var(--portal) 23%,transparent);background:linear-gradient(110deg,rgba(255,255,255,.27),rgba(255,255,255,.76) 28%,rgba(255,255,255,.62) 72%,rgba(255,255,255,.18));box-shadow:inset 0 1px 0 rgba(255,255,255,.94),0 13px 36px rgba(76,68,122,.055);backdrop-filter:blur(16px);clip-path:polygon(11px 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,11px 100%,0 50%);cursor:pointer;touch-action:none;user-select:none;transition:filter .18s ease,background .18s ease,opacity .2s ease}.world-label.machine{--portal:var(--machine);transform:translate(-100%,-50%)}.world-label.maker{--portal:var(--maker);transform:translate(0,-50%)}.world-label.reality{--portal:var(--reality);transform:translate(-50%,0);align-items:center;min-width:clamp(210px,20vw,330px);height:70px}.world-label:hover,.world-label:focus-visible{filter:saturate(1.22);background:rgba(255,255,255,.83)}.portal-number{position:absolute;top:9px;font:700 5px/1 ui-monospace,monospace;letter-spacing:.18em;color:color-mix(in srgb,var(--portal) 70%,#34324e)}.portal-diamond{position:absolute;width:9px;height:9px;border:1px solid color-mix(in srgb,var(--portal) 70%,#35324d);transform:rotate(45deg)}.machine .portal-diamond{right:18px}.maker .portal-diamond{left:18px}.reality .portal-diamond{top:9px}.world-copy{display:flex;flex-direction:column;gap:8px}.world-copy strong{font-size:clamp(10px,1.02vw,16px);font-weight:800;letter-spacing:.13em;white-space:nowrap}.world-copy small{font:650 clamp(4.5px,.43vw,7px)/1 ui-monospace,monospace;letter-spacing:.11em;color:#656378;white-space:nowrap}.maker,.maker .world-copy{align-items:flex-end;text-align:right}.reality .world-copy{align-items:center;text-align:center}
