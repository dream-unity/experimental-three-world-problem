          *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f8fb;color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif}button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid rgba(112,82,220,.55);outline-offset:3px}
          #app{position:relative;width:100vw;height:100dvh;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(247,247,252,.72) 56%,rgba(241,243,249,.93))}
