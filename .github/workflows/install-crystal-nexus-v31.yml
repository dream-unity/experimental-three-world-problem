          #app.detail .world-label,#app.detail .nexus-title{opacity:0!important;visibility:hidden!important;pointer-events:none!important}#app.detail .back,#app.detail .detail-title{opacity:1;visibility:visible;pointer-events:auto}#app.detail .sub-label{opacity:1;visibility:visible;pointer-events:auto}
          .arcade{--game:#4e9dff;--game-rgb:78,157,255;position:absolute;z-index:1000;inset:0;overflow:hidden;background:#f9faff;color:#17182d;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease;isolation:isolate}.arcade.open{opacity:1;visibility:visible;pointer-events:auto}#gameCanvas{position:absolute;z-index:0;inset:0;width:100%;height:100%;display:block;touch-action:none}.game-vignette{display:none}.game-bar{position:absolute;z-index:100;top:10px;left:10px;right:10px;min-height:64px;display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid rgba(23,24,45,.18);background:rgba(255,255,255,.94);box-shadow:0 12px 35px rgba(42,38,79,.08);backdrop-filter:blur(16px)}.game-icon{width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center;border:1px solid rgba(23,24,45,.19);background:#fff;font-size:17px;font-weight:800;cursor:pointer}.game-heading{min-width:0;display:flex;flex-direction:column;gap:3px;margin-right:auto}.game-heading small{font:650 6px/1 ui-monospace,monospace;letter-spacing:.15em;color:#77758b}.game-heading strong{font-size:10px;letter-spacing:.13em;white-space:nowrap}.game-readout{display:flex;gap:14px;padding:0 8px}.game-readout span{min-width:46px;display:flex;flex-direction:column;align-items:flex-end}.game-readout small{font:650 6px/1 ui-monospace,monospace;color:#77758b}.game-readout b{font-size:10px}.game-metric b{color:var(--game)}.game-card,.game-state{position:absolute;z-index:70;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:min(420px,calc(100vw - 34px));padding:30px 27px 26px;border:1px solid rgba(23,24,45,.2);background:rgba(255,255,255,.96);text-align:center;box-shadow:18px 18px 0 rgba(86,73,145,.045),0 24px 70px rgba(48,43,87,.09);opacity:0;visibility:hidden;pointer-events:none;transition:.2s ease}.arcade.ready .game-card,.arcade.loading-runtime .game-card,.arcade.paused .game-state,.arcade.over .game-state{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.game-glyph{width:82px;height:82px;margin:0 auto 17px;display:grid;place-items:center;border:1px solid var(--game);color:var(--game);font-size:34px}.game-card>small{font:800 7px/1 ui-monospace,monospace;color:var(--game);letter-spacing:.2em}.game-card h1{margin:8px 0 10px;font-size:38px;line-height:.95}.game-card p{margin:0 auto 20px;max-width:310px;color:#67657b;font-size:12px;line-height:1.5}.game-card button,.game-state button{min-width:132px;height:44px;border:1px solid var(--game);background:#fff;font-size:8px;font-weight:800;letter-spacing:.16em;cursor:pointer}.game-state strong{display:block;font-size:25px}.game-state small{display:block;margin:8px 0 18px;font-size:7px;letter-spacing:.16em}.game-toast{position:absolute;z-index:60;left:50%;top:18%;transform:translate(-50%,-8px);opacity:0}.game-toast.show{opacity:1}.game-hint{position:absolute;z-index:50;left:50%;bottom:15px;transform:translateX(-50%);padding:8px 12px;border:1px solid rgba(23,24,45,.13);background:rgba(255,255,255,.9);font:750 7px/1 ui-monospace,monospace;letter-spacing:.14em;white-space:nowrap}.game-state{padding:28px}.become-lab{position:absolute!important;z-index:30!important;inset:82px 0 0!important;overflow:auto!important}#app.game-open>#world,#app.game-open>.nexus-atmosphere,#app.game-open>.brand,#app.game-open>.score-control,#app.game-open>.nexus-title,#app.game-open>.world-label,#app.game-open>.back,#app.game-open>.detail-title,#app.game-open>.sub-label{visibility:hidden!important;pointer-events:none!important}
          @media(max-width:720px){.brand{left:14px;top:14px}.brand>small{display:none}.score-control{right:10px;top:10px;min-width:91px;height:36px}.nexus-title{top:53%}.world-label{min-width:132px;height:58px;padding:0 12px}.world-label.machine{transform:translate(-88%,-50%)}.world-label.maker{transform:translate(-12%,-50%)}.world-label.reality{min-width:166px;height:58px}.world-copy{gap:5px}.world-copy strong{font-size:8px}.world-copy small{font-size:4px;letter-spacing:.04em}.portal-diamond,.portal-number{display:none}.game-bar{display:grid;grid-template-columns:42px minmax(0,1fr) repeat(3,42px);grid-template-rows:42px 34px;grid-template-areas:"back heading sound pause restart" "readout readout readout readout readout";min-height:91px}.game-icon{width:42px;height:42px}.game-heading{grid-area:heading}.game-readout{grid-area:readout;justify-content:center;border-top:1px solid rgba(23,24,45,.1);padding-top:5px}#gameBack{grid-area:back}#gameSound{grid-area:sound}#gamePause{grid-area:pause}#gameRestart{grid-area:restart}.game-card,.game-state{top:54%}.become-lab{inset:106px 0 0!important}}
          @media(prefers-reduced-motion:reduce){.score-mark i,.loading span{animation:none}}
          CSS_EOF

          cat > unity-ui.js <<'UI_EOF'
          (()=>{'use strict';
            const audio=document.getElementById('scoreAudio');
            const button=document.getElementById('scoreControl');
            const state=document.getElementById('scoreState');
            const key='dream-unity-dream-maker-eye-muted';
            let muted=false,context=null,source=null,analyser=null,data=null,lastEnergy=0,flux=0;
            const sample={low:.16,mid:.15,high:.12,energy:.16,flux:0,beat:0,playing:false,currentTime:0,duration:359.45};
            const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
            try{muted=localStorage.getItem(key)==='1'}catch{}
            function reflect(mode){if(!button||!state)return;const on=mode==='on';button.dataset.state=mode;button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'Turn Dream Unity music off':'Play Dream Unity music');state.textContent=on?'ON':mode==='loading'?'LOADING':mode==='off'?'OFF':'PLAY'}
            async function ensureAnalysis(){if(!audio)return false;if(analyser){if(context?.state==='suspended')await context.resume().catch(()=>{});return true}const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;try{context=new AC({latencyHint:'interactive'});source=context.createMediaElementSource(audio);analyser=context.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.72;source.connect(analyser);analyser.connect(context.destination);data=new Uint8Array(analyser.frequencyBinCount);await context.resume().catch(()=>{});return true}catch{return false}}
            function band(lo,hi){if(!analyser||!data||!context)return 0;const hz=context.sampleRate/analyser.fftSize;const a=Math.max(1,Math.floor(lo/hz)),b=Math.min(data.length-1,Math.ceil(hi/hz));let sum=0,n=0;for(let i=a;i<=b;i++){const v=data[i]/255;sum+=v*v;n++}return n?Math.sqrt(sum/n):0}
