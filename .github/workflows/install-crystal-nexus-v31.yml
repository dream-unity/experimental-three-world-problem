          .nexus-atmosphere::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(255,255,255,0) 0 34%,rgba(255,255,255,.24) 64%,rgba(255,255,255,.72) 100%);pointer-events:none}
          #world{position:absolute;z-index:2;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#app.dragging #world{cursor:grabbing}
          .brand{position:absolute;z-index:40;left:clamp(20px,3vw,48px);top:clamp(20px,3vh,34px);display:grid;grid-template-columns:28px auto;grid-template-rows:auto auto;gap:2px 11px;align-items:center;pointer-events:none;color:#34324e;letter-spacing:.24em;font-weight:800}.brand>i{grid-row:1/3;width:18px;height:18px;border:1px solid rgba(79,77,121,.58);transform:rotate(45deg);position:relative}.brand>i::before,.brand>i::after{content:"";position:absolute;inset:3px;border:1px solid rgba(125,102,224,.42)}.brand>i::after{inset:7px;background:rgba(128,98,240,.32)}.brand>span{font-size:11px;white-space:nowrap}.brand>small{font:650 5px/1.2 ui-monospace,monospace;letter-spacing:.18em;color:#8a879e}
