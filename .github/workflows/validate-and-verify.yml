name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Imagine-that openings, social objectives and diversity
        run: npm test

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match Imagine-opening Become source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css main.js arcade.js arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-diversity-09.txt arcade-parts/become-social-agency-10.txt arcade-parts/become-social-integration-11.txt arcade-parts/become-compressed-12.txt arcade-parts/become-rapid-entry-13.txt arcade-parts/become-activation-objectives-14.txt)
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true
          grep -q 'arcade.js?v=20260826-become-imagine-opening-17' /tmp/dream-unity-live/index.html
          grep -q 'become-activation-objectives-14.txt' /tmp/dream-unity-live/arcade.js
          grep -q 'become-rapid-entry-13.txt' /tmp/dream-unity-live/arcade.js
          ! grep -q 'become-live-02.txt' /tmp/dream-unity-live/arcade.js
          ! grep -Eqi 'vercel|blockrun|groq|web-llm|transformers' /tmp/dream-unity-live/arcade.js
          grep -q "S14_VERSION='20260826-activation-objectives-2'" /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'S14_SCENE_OPENING' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'function s14ImagineScene' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'function s14ApplySceneOpening' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q '__sceneOpening14' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'S14_WIN_MAX=11' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'S14_OBJECTIVE_MAX=14' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'S14_SOLVED_MAX=11' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'SOCIAL WIN' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'SOLVED WHEN' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'S13_SCENE_MAX=34' /tmp/dream-unity-live/arcade-parts/become-rapid-entry-13.txt
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css /tmp/dream-unity-live/become.css /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Record Imagine-opening social-agency deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'become':{
              'scenario_source':'instant_objective_driven_social_agency_maximin_synthesis',
              'activation_objective_version':'20260826-activation-objectives-2',
              'mandatory_scene_opening':['Imagine that you','Imagine that you\'re'],
              'scene_opening_enforced_after_compression':True,
              'scene_opening_rebudgeted_inside_34_word_limit':True,
              'social_win_count':40,
              'social_win_word_max':11,
              'faculty_objective_count':17,
              'faculty_objective_word_max':14,
              'faculty_solved_when_word_max':11,
              'faculty_completion_rule':'score_experiential_state_change_not_verbal_understanding',
              'activation_loop':['social_win','objective','experiential_proof','feedback','self_score'],
              'scene_word_max':34,
              'entry_packet_word_max':64,
              'world_family_count':26,
              'social_profile_count':40,
              'combined_novelty_axes':29,
              'same_world_family_allowed_within_session':False,
              'same_social_profile_allowed_within_session':False,
              'same_social_win_allowed_within_session':False,
              'cross_session_world_memory':True,
              'cross_session_social_memory':True,
              'queue_prewarmed_before_start':True,
              'cloud_dispatcher_loaded':False,
              'between_scenario_network_wait':False,
              'original_scenario_bank_used_as_fallback':False,
              'personal_transfer_text_stored_in_novelty_memory':False,
            },
            'sha256':Path('/tmp/live-checksums.txt').read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Imagine-opening Become deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
