name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Imagine-that openings, social objectives and diversity
        run: npm test
      - name: Validate Returning Dream system
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VERSION = '20260828-remembered-tomorrow-4'" main.js
          grep -q 'remembered-tomorrow-10.txt' main.js
          grep -q "ctx.fillStyle = '#ffffff'" visual-parts/remembered-tomorrow-10.txt
          grep -q 'render = function rememberedTomorrowRender' visual-parts/remembered-tomorrow-10.txt
          grep -q 'drawOverview = function rememberedTomorrowOverview' visual-parts/remembered-tomorrow-10.txt
          grep -q 'drawDetail = function rememberedTomorrowDetail' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawTemporalGhost' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawPossibleFutures' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawLivingPath' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawDreamMembrane' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawCompressionBraid' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawMatter' visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawUnity' visual-parts/remembered-tomorrow-10.txt
          grep -q 'I REMEMBER TOMORROW' index.html
          grep -q 'Neither prophecy nor fate' index.html
          grep -q 'THE GHOST IN THE MIRROR' index.html
          grep -q 'assets/i-remember-tomorrow.mp3' index.html
          ! grep -Eq 'du-voice|data-voice|voice\.js|voice\.css|realtime-session|dream-unity-voice-live|TAP TO SPEAK|SpeechRecognition|speechSynthesis' index.html
          ! grep -Eq 'voiceState|Projected sound shells|oracle iris|coralTexture|black architectural wound' visual-parts/remembered-tomorrow-10.txt
          test ! -e voice.js
          test ! -e voice.css
          test ! -e api/realtime-session.js
          test ! -e tests/voice.test.mjs
          grep -q "WORLD.machine.css = '#00BDE8'" visual-parts/remembered-tomorrow-10.txt
          grep -q "WORLD.maker.css = '#00C983'" visual-parts/remembered-tomorrow-10.txt
          grep -q "WORLD.reality.css = '#7448FF'" visual-parts/remembered-tomorrow-10.txt
          grep -q -- '--paper:#fff' unity-cycle.css
          test -s assets/i-remember-tomorrow.mp3

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match Returning Dream and Become source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css unity-cycle.css unity-ui.js main.js arcade.js assets/i-remember-tomorrow.mp3 visual-parts/part-01.txt visual-parts/part-02.txt visual-parts/part-03.txt visual-parts/part-04.txt visual-parts/part-05.txt visual-parts/part-06.txt visual-parts/remembered-tomorrow-10.txt arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-diversity-09.txt arcade-parts/become-social-agency-10.txt arcade-parts/become-social-integration-11.txt arcade-parts/become-compressed-12.txt arcade-parts/become-rapid-entry-13.txt arcade-parts/become-activation-objectives-14.txt)
          retired_files=(voice.js voice.css api/realtime-session.js tests/voice.test.mjs)
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts /tmp/dream-unity-live/visual-parts /tmp/dream-unity-live/assets
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then
              for path in "${retired_files[@]}"; do
                if curl --fail --location --silent --head "$PAGE_URL/$path?source=${GITHUB_SHA}" >/dev/null; then matched=false; break; fi
              done
            fi
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true

          grep -q 'main.js?v=20260828-remembered-tomorrow-4' /tmp/dream-unity-live/index.html
          grep -q 'unity-cycle.css?v=20260828-remembered-tomorrow-4' /tmp/dream-unity-live/index.html
          grep -q 'remembered-tomorrow-10.txt' /tmp/dream-unity-live/main.js
          grep -q "ctx.fillStyle = '#ffffff'" /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q 'render = function rememberedTomorrowRender' /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q 'drawOverview = function rememberedTomorrowOverview' /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawTemporalGhost' /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawPossibleFutures' /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q 'function rtDrawDreamMembrane' /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q 'I REMEMBER TOMORROW' /tmp/dream-unity-live/index.html
          ! grep -Eq 'du-voice|data-voice|voice\.js|voice\.css|realtime-session|dream-unity-voice-live|TAP TO SPEAK|SpeechRecognition|speechSynthesis' /tmp/dream-unity-live/index.html
          ! grep -Eq 'voiceState|Projected sound shells|oracle iris|coralTexture|black architectural wound' /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q "WORLD.machine.css = '#00BDE8'" /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q "WORLD.maker.css = '#00C983'" /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt
          grep -q "WORLD.reality.css = '#7448FF'" /tmp/dream-unity-live/visual-parts/remembered-tomorrow-10.txt

          grep -q 'arcade.js?v=20260827-fighter-jet-performance-20' /tmp/dream-unity-live/index.html
          grep -q 'become-activation-objectives-14.txt' /tmp/dream-unity-live/arcade.js
          grep -q "S14_VERSION='20260826-activation-objectives-2'" /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'SOCIAL WIN' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'SOLVED WHEN' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css /tmp/dream-unity-live/become.css /tmp/dream-unity-live/unity-cycle.css /tmp/dream-unity-live/unity-ui.js /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js /tmp/dream-unity-live/assets/* /tmp/dream-unity-live/visual-parts/*.txt /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Record Returning Dream and Become deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'overview':{
              'theme':'stage_coral_returning_dream',
              'canvas_background':'#FFFFFF',
              'legacy_render_vignette_active':False,
              'nebula_fog_active':False,
              'world_palette':{'machine':'#00BDE8','maker':'#00C983','reality':'#7448FF','unity':'#E7A429'},
              'connected_instrument':True,
              'distinct_world_geometries':True,
              'temporal_ghost_field':True,
              'plural_remembered_futures':True,
              'ether_compression_matter_return_cycle':True,
              'generated_core_asset':None,
              'homepage_score':'assets/i-remember-tomorrow.mp3',
              'voice_interface_active':False,
              'renderer_override':'visual-parts/remembered-tomorrow-10.txt',
              'main_cache_version':'20260828-remembered-tomorrow-4'
            },
            'become':{
              'scenario_source':'instant_objective_driven_social_agency_maximin_synthesis',
              'activation_objective_version':'20260826-activation-objectives-2',
              'mandatory_scene_opening':['Imagine that you','Imagine that you\'re'],
              'social_win_count':40,
              'faculty_objective_count':17,
              'faculty_completion_rule':'score_experiential_state_change_not_verbal_understanding',
              'scene_word_max':34,
              'world_family_count':26,
              'social_profile_count':40,
              'combined_novelty_axes':29,
              'between_scenario_network_wait':False,
              'original_scenario_bank_used_as_fallback':False
            },
            'sha256':Path('/tmp/live-checksums.txt').read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Returning Dream deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
