name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Dream Unity and guaranteed Become generation
        run: npm test

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match validated source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css main.js arcade.js arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-live-02.txt)
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true
          grep -q 'arcade.js?v=20260826-become-guaranteed-generation-8' /tmp/dream-unity-live/index.html
          grep -q 'BECOME_SYNTHESIS_KITS' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'function bSynthGenerate' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'SYNTHESIS BACKUP' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'NO PREWRITTEN WORLD FALLBACK' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'BECOME_BROWSER_TIMEOUT_MS = 12_000' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css /tmp/dream-unity-live/become.css /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Verify cloud proxy identity and CORS
        shell: bash
        env:
          LIVE_API: https://dream-unity-become-live.vercel.app/api/become-scenario
          PAGE_ORIGIN: https://dream-unity.github.io
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$LIVE_API" > /tmp/become-service.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/become-service.json').read_text())
          assert data['ok'] is True
          assert data['provider']=='blockrun'
          assert data['model']=='nvidia/gpt-oss-120b'
          assert data['requestTimeoutMs']==20000
          assert data['credentialMode']=='none'
          PY
          code=$(curl --silent --show-error --output /tmp/preflight --dump-header /tmp/preflight-h --write-out '%{http_code}' -X OPTIONS -H "Origin: $PAGE_ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type' "$LIVE_API")
          test "$code" = '204'
          grep -qi 'access-control-allow-origin: https://dream-unity.github.io' /tmp/preflight-h

      - name: Probe optional cloud capacity without blocking synthesis guarantee
        shell: bash
        env:
          LIVE_API: https://dream-unity-become-live.vercel.app/api/become-scenario
          PAGE_ORIGIN: https://dream-unity.github.io
        run: |
          set -euo pipefail
          cat > /tmp/request.json <<'JSON'
          {"trialIndex":0,"trialCount":1,"sessionNonce":"github-actions-cloud-capacity-probe","recentScenarios":[],"currentPerformance":[],"previousWeakestMetric":null}
          JSON
          code=$(curl --silent --show-error --output /tmp/cloud.json --write-out '%{http_code}' --max-time 25 -X POST -H "Origin: $PAGE_ORIGIN" -H 'Content-Type: application/json' --data-binary @/tmp/request.json "$LIVE_API" || true)
          export CLOUD_STATUS="$code"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          code=os.environ.get('CLOUD_STATUS') or '000'
          body={}
          try: body=json.loads(Path('/tmp/cloud.json').read_text())
          except Exception: pass
          if code=='200':
              s=body.get('scenario') or {}
              assert s.get('title') and s.get('dimensions')
              print('Cloud AI available:', s['title'])
          else:
              print('Cloud AI unavailable with HTTP',code,'— verified synthesis fallback remains authoritative')
          Path('/tmp/cloud-status.txt').write_text(code+'\n')
          PY

      - name: Commit live deployment receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          cloud=Path('/tmp/cloud-status.txt').read_text().strip()
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'become':{
              'generation':'cloud_ai_first_relational_synthesis_guaranteed',
              'cloud_provider':'blockrun',
              'cloud_model':'nvidia/gpt-oss-120b',
              'cloud_status_http':cloud,
              'cloud_request_timeout_ms':20000,
              'browser_cloud_timeout_ms':12000,
              'cloud_cooldown_ms':180000,
              'generative_synthesis_fallback':True,
              'synthesis_runtime_tested_with_network_disabled':True,
              'synthesis_families':10,
              'novelty_rejection':True,
              'original_scenario_bank_used_as_fallback':False,
              'indefinite_spinner_possible':False,
              'personal_transfer_text_sent_to_cloud':False,
            },
            'sha256':Path('/tmp/live-checksums.txt').read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified guaranteed Become generation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
