name: Validate Crystal Nexus and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYMENT_STATUS.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crystal-nexus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Detect staged score hydration
        id: stage
        shell: bash
        run: |
          if [ -f .crystal-nexus-bootstrap ]; then
            echo 'staged=true' >> "$GITHUB_OUTPUT"
            echo 'Dream Maker Eye is being atomically hydrated; validation will run on the resulting source commit.'
          else
            echo 'staged=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Use Node
        if: steps.stage.outputs.staged == 'false'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        if: steps.stage.outputs.staged == 'false'
        run: npm ci
      - name: Install Chromium
        if: steps.stage.outputs.staged == 'false'
        run: npx playwright install --with-deps chromium
      - name: Validate Crystal Nexus, score, interactions and all nine games
        if: steps.stage.outputs.staged == 'false'
        env:
          DU_EMBLEM_SCREENSHOT_DIR: crystal-nexus-artifacts
        run: npm run test:all
      - name: Publish visual evidence
        if: always() && steps.stage.outputs.staged == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: crystal-nexus-${{ github.sha }}
          path: crystal-nexus-artifacts
          if-no-files-found: warn
          retention-days: 14

  verify-live:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.validate.outputs.staged == 'false'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for GitHub Pages to match Crystal Nexus source and assets
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          live_dir=$(mktemp -d)
          trap 'rm -rf "$live_dir"' EXIT
          mkdir -p "$live_dir/assets"
          ready=false
          for attempt in $(seq 1 72); do
            curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 \
              "$PAGE_URL/index.html?source=${GITHUB_SHA}&attempt=$attempt" -o "$live_dir/index.html" || true
            if cmp --silent index.html "$live_dir/index.html"; then
              ready=true
              for path in nexus.css main.js unity-ui.js assets/dream-maker-eye.mp3; do
                curl --fail --location --silent --show-error --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors \
                  "$PAGE_URL/$path?source=${GITHUB_SHA}&attempt=$attempt" -o "$live_dir/$path" || { ready=false; break; }
                cmp --silent "$path" "$live_dir/$path" || { ready=false; break; }
              done
            fi
            if [ "$ready" = true ]; then break; fi
            echo "Crystal Nexus has not propagated yet ($attempt/72)."
            sleep 5
          done
          test "$ready" = true
          grep -q 'assets/dream-maker-eye.mp3' "$live_dir/index.html"
          grep -q "RELEASE = '20260831-crystal-nexus-31'" "$live_dir/main.js"
          grep -q "track: 'Dream Maker Eye'" "$live_dir/unity-ui.js"
          test "$(sha256sum "$live_dir/assets/dream-maker-eye.mp3" | cut -d' ' -f1)" = 'b23033e55592bdb62cb9a51f529aebf63401453d15fe6b45e06a9fae298e0d14'
      - name: Exercise live Crystal Nexus and all nine games
        env:
          DU_BROWSER_BASE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: npm run test:browser
      - name: Exercise live controls
        env:
          DU_INTERACTION_BASE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: npm run test:interactions
      - name: Exercise live desktop and mobile composition
        env:
          DU_EMBLEM_BASE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: npm run test:emblems

  record-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.staged == 'false'
    needs: [validate, verify-live]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record verified Crystal Nexus deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt = {
            'project': 'Dream Unity — Experimental Three-World Problem',
            'deployment': 'verified-live',
            'source_sha': os.environ['SOURCE_SHA'],
            'page_url': 'https://dream-unity.github.io/experimental-three-world-problem/',
            'verified_at': datetime.now(timezone.utc).isoformat(),
            'overview': {
              'renderer': 'crystal-nexus',
              'renderer_version': '20260831-crystal-nexus-31',
              'reference_driven': True,
              'central_sovereign_crystal': True,
              'faceted_portals': ['Dream Machine', 'Dream Maker', 'Dream World'],
              'celestial_sphere': True,
              'crystalline_horizon': 'procedural',
              'homepage_score': 'assets/dream-maker-eye.mp3',
              'homepage_score_title': 'Dream Maker Eye',
              'homepage_score_sha256': 'b23033e55592bdb62cb9a51f529aebf63401453d15fe6b45e06a9fae298e0d14',
              'whole_field_orbit': True,
              'autonomous_rotation': False,
              'accelerating_rotation': False,
              'voice_interface_active': False,
            },
            'nine_games': 'validated',
            'desktop_mobile': 'validated',
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git commit -m 'Record verified Crystal Nexus deployment [skip ci]'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
