name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate nine games, Relational Identity Drift and live Become
        run: npm test

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match validated source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(
            index.html
            styles.css
            become.css
            main.js
            arcade.js
            arcade-parts/part-01.txt
            arcade-parts/part-02.txt
            arcade-parts/part-03.txt
            arcade-parts/part-04.txt
            arcade-parts/part-05.txt
            arcade-parts/perceive-role-logic.txt
            arcade-parts/perceive-aerial-01.txt
            arcade-parts/perceive-aerial-02.txt
            arcade-parts/perceive-aerial-03.txt
            arcade-parts/perceive-aerial-04.txt
            arcade-parts/perceive-aerial-05.txt
            arcade-parts/perceive-aerial-06.txt
            arcade-parts/perceive-aerial-07.txt
            arcade-parts/perceive-aerial-08.txt
            arcade-parts/become-lab-01.txt
            arcade-parts/become-live-02.txt
          )
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts
          matched=false
          for attempt in $(seq 1 40); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
                "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then
                matched=false
                break
              fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then
                matched=false
                break
              fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/40)."
            sleep 5
          done
          test "$matched" = true

          grep -q 'PARALLAX WING' /tmp/dream-unity-live/index.html
          grep -q 'nearest escort on the outside' /tmp/dream-unity-live/index.html
          grep -q 'function roleDriftGeometry' /tmp/dream-unity-live/arcade-parts/perceive-role-logic.txt
          grep -q 'stale-role-perseveration' /tmp/dream-unity-live/arcade-parts/perceive-aerial-*.txt

          grep -q 'function createBecomeLab' /tmp/dream-unity-live/arcade-parts/become-lab-01.txt
          grep -q "GAME_BY_KEY\['maker:2'\]" /tmp/dream-unity-live/arcade-parts/become-lab-01.txt
          grep -q 'STATE-ENTRY LATENCY' /tmp/dream-unity-live/arcade-parts/become-lab-01.txt
          grep -q 'DREAM MAKER · BECOME · LIVE AI' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'https://blockrun.ai/api/v1/chat/completions' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'nvidia/gpt-oss-120b' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'NO API KEY' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'NO ACCOUNT' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'INTERNET GENERATED' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'NO MODEL DOWNLOAD' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'NO STORED FALLBACK' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'bLiveTooSimilar' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'bLiveCallWithFailover' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -qi 'groq' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -q 'sessionStorage' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -q '@mlc-ai/web-llm' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -q '@huggingface/transformers' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -q 'navigator.gpu' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          ! grep -q 'become-local-cpu-03' /tmp/dream-unity-live/arcade.js

          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css \
            /tmp/dream-unity-live/become.css /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js \
            /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Verify zero-key browser-accessible GPT-OSS inference
        shell: bash
        env:
          LIVE_API: https://blockrun.ai/api/v1/chat/completions
          PAGE_ORIGIN: https://dream-unity.github.io
        run: |
          set -euo pipefail

          preflight_code=$(curl --silent --show-error --output /tmp/become-preflight-body \
            --dump-header /tmp/become-preflight-headers --write-out '%{http_code}' \
            -X OPTIONS \
            -H "Origin: $PAGE_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            "$LIVE_API")

          export PREFLIGHT_CODE="$preflight_code"
          python3 - <<'PY'
          import os
          from pathlib import Path
          code = int(os.environ['PREFLIGHT_CODE'])
          assert 200 <= code < 300, f'CORS preflight failed with HTTP {code}'
          headers = Path('/tmp/become-preflight-headers').read_text(encoding='utf-8', errors='ignore').lower()
          origin = os.environ['PAGE_ORIGIN'].lower()
          allow_origin = None
          allow_methods = None
          for line in headers.splitlines():
              if line.startswith('access-control-allow-origin:'):
                  allow_origin = line.split(':',1)[1].strip()
              if line.startswith('access-control-allow-methods:'):
                  allow_methods = line.split(':',1)[1].strip()
          assert allow_origin in {'*', origin}, f'Browser origin not allowed: {allow_origin!r}'
          assert allow_methods and 'post' in allow_methods, f'POST not allowed by CORS: {allow_methods!r}'
          PY

          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            --dump-header /tmp/become-live-headers \
            -X POST \
            -H "Origin: $PAGE_ORIGIN" \
            -H 'Content-Type: application/json' \
            -d '{"model":"nvidia/gpt-oss-120b","messages":[{"role":"user","content":"Reply with the single word LIVE"}],"stream":false,"max_tokens":16}' \
            "$LIVE_API" > /tmp/become-live-response.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/become-live-response.json').read_text(encoding='utf-8'))
          content = data.get('choices',[{}])[0].get('message',{}).get('content','')
          assert isinstance(content,str) and content.strip(), 'Zero-key GPT-OSS call returned no completion'
          headers = Path('/tmp/become-live-headers').read_text(encoding='utf-8', errors='ignore').lower()
          origin = os.environ['PAGE_ORIGIN'].lower()
          allow_origin = None
          for line in headers.splitlines():
              if line.startswith('access-control-allow-origin:'):
                  allow_origin = line.split(':',1)[1].strip()
          assert allow_origin in {'*', origin}, f'Completion response is not browser-readable: {allow_origin!r}'
          print('Verified zero-key live GPT-OSS completion:', content[:80])
          PY

      - name: Commit machine-readable live deployment receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt = {
              'project': 'Dream Unity — Experimental Three-World Problem',
              'deployment': 'verified-live',
              'source_sha': os.environ['SOURCE_SHA'],
              'page_url': os.environ['PAGE_URL'],
              'nine_portal_compatibility': 'validated',
              'perceive': {
                  'game': 'Parallax Wing',
                  'mechanic': 'relational_identity_drift',
              },
              'become': {
                  'game': 'Become Reality Lab',
                  'scenario_source': 'zero_key_internet_live_cloud',
                  'browser_model_download': False,
                  'local_generation': False,
                  'cloud_gateway': 'blockrun',
                  'primary_model': 'nvidia/gpt-oss-120b',
                  'failover_models': ['nvidia/step-3.7-flash','nvidia/mistral-nemotron'],
                  'endpoint': 'https://blockrun.ai/api/v1/chat/completions',
                  'credential_mode': 'none',
                  'account_required': False,
                  'browser_cors_verified': True,
                  'live_inference_verified': True,
                  'client_novelty_rejection': True,
                  'stored_live_fallback': False,
                  'timed_faculties': 17,
                  'state_entry_seconds': 30,
                  'personal_transfer_text_sent_to_generator': False,
              },
              'sha256': Path('/tmp/live-checksums.txt').read_text(encoding='utf-8').splitlines(),
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified zero-key internet Dream Unity deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
