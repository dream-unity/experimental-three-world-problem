name: Validate Sovereign Countermirror and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - DEPLOYMENT_STATUS.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-countermirror-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'

      - name: Validate Countermirror source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            index.html countermirror.css countermirror-core.css
            countermirror-ui.css countermirror-responsive.css
            countermirror.js arcade.js
            assets/sovereign-countermirror.webp
            assets/sovereign-countermirror-mobile.webp
          )
          for path in "${files[@]}"; do test -s "$path"; done

          node --check countermirror.js
          node --check arcade.js

          grep -q 'The Sovereign Countermirror' index.html
          grep -q 'THE SOVEREIGN COUNTERMIRROR' index.html
          grep -q 'THE GHOST IN THE MIRROR' index.html
          grep -q 'Light pierces' index.html
          grep -q 'AWAKEN THE TRUE WAR' index.html
          grep -q 'GRACE WITH TEETH' index.html
          grep -q 'sovereign-countermirror.webp' index.html
          grep -q 'sovereign-countermirror-mobile.webp' index.html
          grep -q 'countermirror.css?v=20260831-countermirror-03' index.html
          grep -q 'countermirror.js?v=20260831-countermirror-03' index.html

          grep -q 'countermirror-core.css' countermirror.css
          grep -q 'countermirror-ui.css' countermirror.css
          grep -q 'countermirror-responsive.css' countermirror.css

          grep -q 'Attention bears weight' countermirror.js
          grep -q 'Will must acquire a body' countermirror.js
          grep -q 'Matter remembers pressure' countermirror.js
          grep -q 'dreamunity:arcade-ready' countermirror.js
          grep -q 'dreamunity:arcade-ready' arcade.js
          grep -q 'become-activation-objectives-14.txt' arcade.js

          if grep -Eqi '<audio|\.mp3|scoreAudio|main\.js|unity-ui\.js|unity-cycle\.css|sovereign-nocturne' index.html; then
            echo 'Legacy audio or renderer reference remains in index.html'
            exit 1
          fi

          test "$(git cat-file -s HEAD:assets/sovereign-countermirror.webp)" -lt 150000
          test "$(git cat-file -s HEAD:assets/sovereign-countermirror-mobile.webp)" -lt 150000

  verify-live:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify GitHub Pages propagation
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(
            index.html countermirror.css countermirror-core.css
            countermirror-ui.css countermirror-responsive.css
            countermirror.js arcade.js
            assets/sovereign-countermirror.webp
            assets/sovereign-countermirror-mobile.webp
          )
          live_dir=$(mktemp -d)
          trap 'rm -rf "$live_dir"' EXIT
          mkdir -p "$live_dir/assets"

          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              curl --fail --location --silent --show-error                 --connect-timeout 10 --max-time 30                 --retry 2 --retry-all-errors --retry-delay 2                 "$PAGE_URL/$path?source=${GITHUB_SHA}&attempt=$attempt"                 --output "$live_dir/$path" || matched=false
              if [ "$matched" = false ]; then break; fi
              cmp --silent "$path" "$live_dir/$path" || matched=false
              if [ "$matched" = false ]; then break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet: attempt $attempt of 60"
            sleep 5
          done

          test "$matched" = true
          grep -q 'The Sovereign Countermirror' "$live_dir/index.html"
          grep -q 'countermirror.js?v=20260831-countermirror-03' "$live_dir/index.html"
          grep -q 'dreamunity:arcade-ready' "$live_dir/countermirror.js"
          grep -q 'dreamunity:arcade-ready' "$live_dir/arcade.js"
