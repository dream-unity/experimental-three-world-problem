name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Use production Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser regression runtime
        run: npx playwright install --with-deps chromium
      - name: Validate source and browser behavior
        env:
          DREAM_UNITY_SCREENSHOT_DIR: ${{ runner.temp }}/sovereign-nocturne-visuals
        run: |
          npm test
          npm run test:browser
      - name: Upload Sovereign Nocturne visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-nocturne-visuals
          path: ${{ runner.temp }}/sovereign-nocturne-visuals
          if-no-files-found: warn
          retention-days: 14
      - name: Validate Sovereign Nocturne release and paused Unity voice
        shell: bash
        run: |
          set -euo pipefail
          renderer=visual-parts/sovereign-nocturne-13.js
          release=20260830-sovereign-nocturne-2
          test -s "$renderer"
          grep -Eq "VERSION[[:space:]]*=[[:space:]]*['\"]${release}['\"]" main.js
          grep -q 'visual-parts/sovereign-nocturne-13.js' main.js
          ! grep -Eqi 'bearing-mirror|sovereign-resonator|visual-parts/part-0[1-6]\.txt' main.js
          grep -q 'webgl2' "$renderer"
          grep -q 'canvas2d-fallback' "$renderer"
          grep -q 'webglcontextlost' "$renderer"
          grep -q 'webglcontextrestored' "$renderer"
          grep -q 'dreamunity:renderer-ready' "$renderer"
          grep -q 'dreamunity:launch-game' "$renderer"
          grep -q 'prefers-reduced-motion' "$renderer"
          grep -q '__dreamUnityRenderer' "$renderer"
          ! grep -Eqi '\.mp3|AudioContext|createMediaElementSource|decodeAudioData' "$renderer"
          grep -q 'AWAKEN THE TRUE WAR' index.html
          grep -q 'Somewhere out in the universe' index.html
          grep -q 'Light pierces' index.html
          grep -q 'through me' index.html
          grep -q 'THE GHOST IN THE MIRROR' index.html
          grep -q 'assets/i-remember-tomorrow.mp3' index.html
          grep -q "styles.css?v=${release}" index.html
          grep -q "become.css?v=${release}" index.html
          grep -q "unity-cycle.css?v=${release}" index.html
          grep -q "unity-ui.js?v=${release}" index.html
          grep -q "main.js?v=${release}" index.html
          grep -q "arcade.js?v=${release}" index.html
          grep -q '__dreamUnityScore' unity-ui.js
          grep -q 'createMediaElementSource' unity-ui.js
          grep -q '<div class="unity-label" id="unityLabel" aria-hidden="true">' index.html
          ! grep -Eqi 'data-voice|duVoice|du-voice|voice\.css|voice\.js|js\.puter\.com|dream-unity-voice-live\.vercel\.app' index.html
          test -s voice.js
          test -s voice.css
          test -s tests/voice-runtime.test.mjs
          test -s tests/voice-disabled.test.mjs
          test -s api/realtime-session.js
          grep -q "API_RELEASE = '20260829-unity-backend-paused-1'" api/realtime-session.js
          grep -q "code: 'VOICE_DISABLED'" api/realtime-session.js
          grep -Eqi -- '--void[[:space:]]*:[[:space:]]*#050505' unity-cycle.css
          grep -Eqi -- '--basalt[[:space:]]*:[[:space:]]*#111010' unity-cycle.css
          grep -Eqi -- '--bone[[:space:]]*:[[:space:]]*#e9e3d6' unity-cycle.css
          grep -Eqi -- '--coral-hot[[:space:]]*:[[:space:]]*#ff4e57' unity-cycle.css
          grep -Eqi -- '--coral[[:space:]]*:[[:space:]]*#ff765f' unity-cycle.css
          test -s assets/i-remember-tomorrow.mp3
          mapfile -t published_mp3 < <(git ls-files '*.mp3')
          test "${#published_mp3[@]}" -eq 1
          test "${published_mp3[0]}" = 'assets/i-remember-tomorrow.mp3'
          ! printf '%s\n' "${published_mp3[@]}" | grep -Eqi 'awaken[ _-]*the[ _-]*true[ _-]*war|\(2\)'

  verify-live:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend_release: ${{ steps.backend_paused.outputs.release }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for GitHub Pages to match the Sovereign Nocturne source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css unity-cycle.css unity-ui.js main.js arcade.js assets/i-remember-tomorrow.mp3 visual-parts/sovereign-nocturne-13.js arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-diversity-09.txt arcade-parts/become-social-agency-10.txt arcade-parts/become-social-integration-11.txt arcade-parts/become-compressed-12.txt arcade-parts/become-rapid-entry-13.txt arcade-parts/become-activation-objectives-14.txt)
          live_dir=$(mktemp -d)
          trap 'rm -rf "$live_dir"' EXIT
          mkdir -p "$live_dir/arcade-parts" "$live_dir/visual-parts" "$live_dir/assets"
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "$live_dir/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "$live_dir/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true

          release=20260830-sovereign-nocturne-2
          renderer="$live_dir/visual-parts/sovereign-nocturne-13.js"
          grep -q "main.js?v=${release}" "$live_dir/index.html"
          grep -q "unity-cycle.css?v=${release}" "$live_dir/index.html"
          grep -q "styles.css?v=${release}" "$live_dir/index.html"
          grep -q "become.css?v=${release}" "$live_dir/index.html"
          grep -q "unity-ui.js?v=${release}" "$live_dir/index.html"
          grep -q "arcade.js?v=${release}" "$live_dir/index.html"
          grep -q '<div class="unity-label" id="unityLabel" aria-hidden="true">' "$live_dir/index.html"
          ! grep -Eqi 'data-voice|duVoice|du-voice|voice\.css|voice\.js|js\.puter\.com|dream-unity-voice-live\.vercel\.app' "$live_dir/index.html"
          grep -q 'visual-parts/sovereign-nocturne-13.js' "$live_dir/main.js"
          ! grep -Eqi 'bearing-mirror|sovereign-resonator|visual-parts/part-0[1-6]\.txt' "$live_dir/main.js"
          grep -q 'webgl2' "$renderer"
          grep -q 'canvas2d-fallback' "$renderer"
          grep -q 'webglcontextlost' "$renderer"
          grep -q 'webglcontextrestored' "$renderer"
          grep -q 'dreamunity:renderer-ready' "$renderer"
          grep -q 'dreamunity:launch-game' "$renderer"
          grep -q 'prefers-reduced-motion' "$renderer"
          ! grep -Eqi '\.mp3|AudioContext|createMediaElementSource|decodeAudioData' "$renderer"
          grep -q 'AWAKEN THE TRUE WAR' "$live_dir/index.html"
          grep -q 'assets/i-remember-tomorrow.mp3' "$live_dir/index.html"
          grep -q '__dreamUnityScore' "$live_dir/unity-ui.js"
          grep -Eqi -- '--void[[:space:]]*:[[:space:]]*#050505' "$live_dir/unity-cycle.css"
          grep -Eqi -- '--bone[[:space:]]*:[[:space:]]*#e9e3d6' "$live_dir/unity-cycle.css"
          grep -Eqi -- '--coral-hot[[:space:]]*:[[:space:]]*#ff4e57' "$live_dir/unity-cycle.css"
          grep -q 'become-activation-objectives-14.txt' "$live_dir/arcade.js"
          grep -q "S14_VERSION='20260826-activation-objectives-2'" "$live_dir/arcade-parts/become-activation-objectives-14.txt"
          grep -q 'SOCIAL WIN' "$live_dir/arcade-parts/become-activation-objectives-14.txt"
          grep -q 'SOLVED WHEN' "$live_dir/arcade-parts/become-activation-objectives-14.txt"
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' "$live_dir/arcade-parts/become-activation-objectives-14.txt"

      - name: Verify the Unity reply endpoint remains paused
        id: backend_paused
        shell: bash
        env:
          BACKEND_URL: https://dream-unity-voice-live.vercel.app/api/realtime-session
          EXPECTED_RELEASE: 20260829-unity-backend-paused-1
          PAGE_ORIGIN: https://dream-unity.github.io
        run: |
          set -euo pipefail
          backend_dir=$(mktemp -d)
          trap 'rm -rf "$backend_dir"' EXIT
          response="$backend_dir/paused.json"
          ready=false
          for attempt in $(seq 1 36); do
            if ! status=$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors --retry-delay 2 --output "$response" --write-out '%{http_code}' "$BACKEND_URL?release=$EXPECTED_RELEASE"); then
              echo "Unity backend tombstone request failed (attempt $attempt/36)."
              sleep 5
              continue
            fi
            if [ "$status" = 410 ] && jq -e --arg release "$EXPECTED_RELEASE" '
              .ok == false
              and .release == $release
              and .service == "dream-unity-voice-chat"
              and .status == "paused"
              and .code == "VOICE_DISABLED"
            ' "$response" >/dev/null; then
              ready=true
              break
            fi
            echo "Unity backend tombstone has not propagated yet (attempt $attempt/36)."
            sleep 5
          done
          test "$ready" = true

          post="$backend_dir/post.json"
          headers="$backend_dir/post.headers"
          status=$(curl --silent --show-error --max-time 20 --request POST --header "Origin: $PAGE_ORIGIN" --header 'Content-Type: application/json' --data '{"message":"This must not reach a provider."}' --dump-header "$headers" --output "$post" --write-out '%{http_code}' "$BACKEND_URL")
          test "$status" = 410
          tr -d '\r' < "$headers" | grep -Fqi "Access-Control-Allow-Origin: $PAGE_ORIGIN"
          jq -e --arg release "$EXPECTED_RELEASE" '.release == $release and .code == "VOICE_DISABLED"' "$post" >/dev/null
          echo "release=$(jq -r '.release' "$response")" >> "$GITHUB_OUTPUT"

  record-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the verified source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the verified voice-free deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
          BACKEND_RELEASE: ${{ needs.verify-live.outputs.backend_release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          checksum_file="$RUNNER_TEMP/dream-unity-source-checksums.txt"
          sha256sum index.html styles.css become.css unity-cycle.css unity-ui.js main.js arcade.js voice.css voice.js api/realtime-session.js assets/* visual-parts/* arcade-parts/*.txt > "$checksum_file"
          export CHECKSUM_FILE="$checksum_file"
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          backend_release=os.environ['BACKEND_RELEASE']
          if backend_release != '20260829-unity-backend-paused-1':
            raise SystemExit(f'Unexpected disabled backend release: {backend_release!r}')
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'overview':{
              'theme':'stage_coral_sovereign_nocturne',
              'canvas_background':'#050505',
              'material_palette':{
                'void':'#050505',
                'basalt':'#111010',
                'bone':'#E9E3D6',
                'living_coral':'#FF4E57',
                'furnace_coral':'#FF765F',
                'machine':'#00C9E8',
                'maker':'#14C98B',
                'reality':'#6840FF'
              },
              'renderer_id':'sovereign-nocturne',
              'renderer_entrypoint':'visual-parts/sovereign-nocturne-13.js',
              'renderer_api':'webgl2',
              'canvas2d_fallback':True,
              'renderer_ready_contract':True,
              'webgl_context_recovery':True,
              'reduced_motion_resolved_pose':True,
              'silent_cycle_seconds':40,
              'legacy_render_vignette_active':False,
              'nebula_fog_active':False,
              'connected_mineral_membrane':True,
              'asymmetrical_low_anchor':True,
              'interior_materials':['coral','bone'],
              'delayed_desaturated_reflection':True,
              'sparse_memory_fibres':True,
              'three_world_portal_glints':True,
              'world_count':3,
              'game_count':9,
              'forbidden_motifs':{
                'gear':False,
                'block':False,
                'frame':False,
                'leader_card':False,
                'loop':False,
                'ribbon':False
              },
              'ether_compression_matter_return_cycle':True,
              'external_runtime_dependencies':False,
              'private_reference_audio_published':False,
              'private_reference_audio_requested':False,
              'homepage_score':'assets/i-remember-tomorrow.mp3',
              'voice_interface_active':False,
              'voice_archive':{
                'source_retained':True,
                'mounted_on_homepage':False,
                'external_resource_hints':False,
                'frontend_network_active':False,
                'backend_status':'paused',
                'backend_release':backend_release
              },
              'main_cache_version':'20260830-sovereign-nocturne-2'
            },
            'become':{
              'scenario_source':'instant_objective_driven_social_agency_maximin_synthesis',
              'activation_objective_version':'20260826-activation-objectives-2',
              'mandatory_scene_opening':['Imagine that you','Imagine that you\'re'],
              'social_win_count':40,
              'faculty_objective_count':17,
              'faculty_completion_rule':'score_experiential_state_change_not_verbal_understanding',
              'scene_word_max':34,
              'world_family_count':26,
              'social_profile_count':40,
              'combined_novelty_axes':29,
              'between_scenario_network_wait':False,
              'original_scenario_bank_used_as_fallback':False
            },
            'source_sha256':Path(os.environ['CHECKSUM_FILE']).read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Sovereign Nocturne deployment [skip ci]'
          git config --local credential.helper '!f() { if [ "$1" = get ]; then echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; fi; }; f'
          trap 'git config --local --unset-all credential.helper >/dev/null 2>&1 || true' EXIT
          git push origin HEAD:main
