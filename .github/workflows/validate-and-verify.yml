name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Imagine-that openings, social objectives and diversity
        run: npm test
      - name: Validate kinetic white visual override source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VERSION = '20260827-unity-oracle-performance-6'" main.js
          grep -q 'light-overview-07.txt' main.js
          grep -q "ctx.fillStyle = '#ffffff'" visual-parts/light-overview-07.txt
          grep -q 'render = function kineticWhiteRender' visual-parts/light-overview-07.txt
          grep -q 'drawBackground = function whiteKineticBackground' visual-parts/light-overview-07.txt
          grep -q 'drawCurve = function fluidLongCurve' visual-parts/light-overview-07.txt
          grep -q 'function wDrawUnity' visual-parts/light-overview-07.txt
          grep -q 'oracleState=app&&app.dataset' visual-parts/light-overview-07.txt
          grep -q 'Projected sound shells' visual-parts/light-overview-07.txt
          grep -q 'TAP TO SPEAK' index.html
          grep -q 'Hello, my name is Unity. What dream would you like to unify?' voice.js
          grep -q 'ARRIVAL_GREETING' voice.js
          grep -q 'prewarmVoiceEndpoint' voice.js
          grep -q 'data-voice-launcher' index.html
          ! grep -q 'du-voice-launcher-copy' index.html
          grep -q 'coreR=unit\*0.032' visual-parts/light-overview-07.txt
          grep -q 'reach=Math.min' visual-parts/light-overview-07.txt
          grep -q "WORLD.machine.css = '#009DFF'" visual-parts/light-overview-07.txt
          grep -q "WORLD.maker.css = '#00C97A'" visual-parts/light-overview-07.txt
          grep -q "WORLD.reality.css = '#7A36F5'" visual-parts/light-overview-07.txt
          grep -q 'display:none!important' light-theme.css

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match kinetic white overview and Become source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css light-theme.css light-theme.js main.js arcade.js voice.css voice.js visual-parts/part-01.txt visual-parts/part-02.txt visual-parts/part-03.txt visual-parts/part-04.txt visual-parts/part-05.txt visual-parts/part-06.txt visual-parts/light-overview-07.txt arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-diversity-09.txt arcade-parts/become-social-agency-10.txt arcade-parts/become-social-integration-11.txt arcade-parts/become-compressed-12.txt arcade-parts/become-rapid-entry-13.txt arcade-parts/become-activation-objectives-14.txt)
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts /tmp/dream-unity-live/visual-parts
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true

          grep -q 'main.js?v=20260827-unity-oracle-performance-6' /tmp/dream-unity-live/index.html
          grep -q 'light-theme.css?v=20260826-white-overview-4' /tmp/dream-unity-live/index.html
          grep -q 'light-overview-07.txt' /tmp/dream-unity-live/main.js
          grep -q "ctx.fillStyle = '#ffffff'" /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'render = function kineticWhiteRender' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'drawCurve = function fluidLongCurve' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'function wDrawUnity' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'oracleState=app&&app.dataset' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'Projected sound shells' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'voice.js?v=20260827-unity-oracle-6' /tmp/dream-unity-live/index.html
          grep -q 'data-voice-launcher' /tmp/dream-unity-live/index.html
          grep -q 'TAP TO SPEAK' /tmp/dream-unity-live/index.html
          grep -q 'ARRIVAL_GREETING' /tmp/dream-unity-live/voice.js
          grep -q 'prewarmVoiceEndpoint' /tmp/dream-unity-live/voice.js
          grep -q 'Hello, my name is Unity. What dream would you like to unify?' /tmp/dream-unity-live/voice.js
          ! grep -q 'du-voice-launcher-copy' /tmp/dream-unity-live/index.html
          grep -q 'coreR=unit\*0.032' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'reach=Math.min' /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q "WORLD.machine.css = '#009DFF'" /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q "WORLD.maker.css = '#00C97A'" /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q "WORLD.reality.css = '#7A36F5'" /tmp/dream-unity-live/visual-parts/light-overview-07.txt
          grep -q 'display:none!important' /tmp/dream-unity-live/light-theme.css

          grep -q 'arcade.js?v=20260827-fighter-jet-performance-20' /tmp/dream-unity-live/index.html
          grep -q 'become-activation-objectives-14.txt' /tmp/dream-unity-live/arcade.js
          grep -q "S14_VERSION='20260826-activation-objectives-2'" /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'SOCIAL WIN' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          grep -q 'SOLVED WHEN' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' /tmp/dream-unity-live/arcade-parts/become-activation-objectives-14.txt
          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css /tmp/dream-unity-live/become.css /tmp/dream-unity-live/light-theme.css /tmp/dream-unity-live/light-theme.js /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js /tmp/dream-unity-live/voice.css /tmp/dream-unity-live/voice.js /tmp/dream-unity-live/visual-parts/*.txt /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Record kinetic white overview and Become deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'overview':{
              'theme':'kinetic_white',
              'canvas_background':'#ffffff',
              'legacy_render_vignette_active':False,
              'nebula_fog_active':False,
              'world_palette':{'machine':'#009DFF','maker':'#00C97A','reality':'#7A36F5','unity':'#F59E0B'},
              'long_bezier_ribbons':True,
              'connection_endpoint_overshoot':True,
              'braided_echo_arcs':True,
              'world_orbit_ribbons':5,
              'world_satellites':True,
              'unity_core_scale':'0.032 * viewport unit',
              'unity_orbit_planes':3,
              'unity_orbit_depth_occlusion':True,
              'renderer_override':'visual-parts/light-overview-07.txt',
              'main_cache_version':'20260827-unity-oracle-performance-6'
            },
            'voice':{
              'launcher':'central_unity_oracle',
              'detached_talk_pill':False,
              'arrival_greeting':'Hello, my name is Unity. What dream would you like to unify?',
              'visual_affordance':'3d_oracle_iris_sound_shells_and_inline_tap_invite',
              'speech_mode':'browser_native',
              'backend':'dream-unity-voice-live.vercel.app'
            },
            'become':{
              'scenario_source':'instant_objective_driven_social_agency_maximin_synthesis',
              'activation_objective_version':'20260826-activation-objectives-2',
              'mandatory_scene_opening':['Imagine that you','Imagine that you\'re'],
              'social_win_count':40,
              'faculty_objective_count':17,
              'faculty_completion_rule':'score_experiential_state_change_not_verbal_understanding',
              'scene_word_max':34,
              'world_family_count':26,
              'social_profile_count':40,
              'combined_novelty_axes':29,
              'between_scenario_network_wait':False,
              'original_scenario_bank_used_as_fallback':False
            },
            'sha256':Path('/tmp/live-checksums.txt').read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record kinetic white overview deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
