name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate nine games, Relational Identity Drift and live Become
        run: npm test

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match validated source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(
            index.html
            styles.css
            become.css
            main.js
            arcade.js
            arcade-parts/part-01.txt
            arcade-parts/part-02.txt
            arcade-parts/part-03.txt
            arcade-parts/part-04.txt
            arcade-parts/part-05.txt
            arcade-parts/perceive-role-logic.txt
            arcade-parts/perceive-aerial-01.txt
            arcade-parts/perceive-aerial-02.txt
            arcade-parts/perceive-aerial-03.txt
            arcade-parts/perceive-aerial-04.txt
            arcade-parts/perceive-aerial-05.txt
            arcade-parts/perceive-aerial-06.txt
            arcade-parts/perceive-aerial-07.txt
            arcade-parts/perceive-aerial-08.txt
            arcade-parts/become-lab-01.txt
            arcade-parts/become-live-02.txt
          )
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts
          matched=false
          for attempt in $(seq 1 40); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
                "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then
                matched=false
                break
              fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then
                matched=false
                break
              fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/40)."
            sleep 5
          done
          test "$matched" = true

          grep -q 'PARALLAX WING' /tmp/dream-unity-live/index.html
          grep -q 'nearest escort on the outside' /tmp/dream-unity-live/index.html
          grep -q 'function roleDriftGeometry' /tmp/dream-unity-live/arcade-parts/perceive-role-logic.txt
          grep -q 'stale-role-perseveration' /tmp/dream-unity-live/arcade-parts/perceive-aerial-*.txt

          grep -q 'function createBecomeLab' /tmp/dream-unity-live/arcade-parts/become-lab-01.txt
          grep -q "GAME_BY_KEY\['maker:2'\]" /tmp/dream-unity-live/arcade-parts/become-lab-01.txt
          grep -q 'STATE-ENTRY LATENCY' /tmp/dream-unity-live/arcade-parts/become-lab-01.txt
          grep -q 'DREAM MAKER · BECOME · LIVE AI' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'ZERO-CREDENTIAL LOCAL AI' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'BECOME_LOCAL_WEBLLM_URL' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'SmolLM2-360M-Instruct-q4f32_1-MLC' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'navigator.gpu' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'bLocalTooSimilar' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'GPT-OSS 120B' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'BECOME_GROQ_SESSION_KEY' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'X-Groq-Api-Key' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'dream-unity-become-live.vercel.app' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'NO STORED WORLD' /tmp/dream-unity-live/arcade-parts/become-live-02.txt
          grep -q 'bLivePrefetch' /tmp/dream-unity-live/arcade-parts/become-live-02.txt

          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css \
            /tmp/dream-unity-live/become.css /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js \
            /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Verify optional Groq Become inference service identity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            https://dream-unity-become-live.vercel.app/api/become-scenario > /tmp/become-service.json
          python3 - <<'PY'
          import json
          with open('/tmp/become-service.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('ok') is True
          assert data.get('service') == 'dream-unity-become-live'
          assert data.get('provider') == 'groq'
          assert data.get('model') == 'openai/gpt-oss-120b'
          assert data.get('credentialMode') in {'session-key', 'server'}
          PY

          code=$(curl --silent --show-error --output /tmp/become-no-key.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            https://dream-unity-become-live.vercel.app/api/become-scenario)
          test "$code" = '401'
          python3 - <<'PY'
          import json
          with open('/tmp/become-no-key.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('code') == 'GROQ_KEY_REQUIRED'
          PY

      - name: Commit machine-readable live deployment receipt
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt = {
              'project': 'Dream Unity — Experimental Three-World Problem',
              'deployment': 'verified-live',
              'source_sha': os.environ['SOURCE_SHA'],
              'page_url': os.environ['PAGE_URL'],
              'nine_portal_compatibility': 'validated',
              'perceive': {
                  'game': 'Parallax Wing',
                  'mechanic': 'relational_identity_drift',
              },
              'become': {
                  'game': 'Become Reality Lab',
                  'scenario_source': 'local_webgpu_default_groq_optional',
                  'zero_credential_default': True,
                  'local_provider': 'webllm_webgpu',
                  'local_model': 'SmolLM2-360M-Instruct-q4f32_1-MLC',
                  'optional_cloud_provider': 'groq',
                  'optional_cloud_model': 'openai/gpt-oss-120b',
                  'backend': 'https://dream-unity-become-live.vercel.app/api/become-scenario',
                  'credential_mode': 'none_for_local_optional_browser_session_key_for_groq',
                  'local_novelty_rejection': True,
                  'cloud_novelty_rejection': True,
                  'stored_live_fallback': False,
                  'timed_faculties': 17,
                  'state_entry_seconds': 30,
                  'personal_transfer_text_sent_to_generator': False,
                  'groq_key_persisted_to_performance_history': False,
              },
              'sha256': Path('/tmp/live-checksums.txt').read_text(encoding='utf-8').splitlines(),
              'verified_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record verified zero-credential Dream Unity deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
