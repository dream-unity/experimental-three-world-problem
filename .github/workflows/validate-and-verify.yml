name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate Dream Unity social agency and quantitative diversity
        run: npm test

  verify-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for GitHub Pages to match validated social-agency source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css main.js arcade.js arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-live-02.txt arcade-parts/become-diversity-09.txt arcade-parts/become-social-agency-10.txt)
          rm -rf /tmp/dream-unity-live
          mkdir -p /tmp/dream-unity-live/arcade-parts
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "/tmp/dream-unity-live/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "/tmp/dream-unity-live/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true
          grep -q 'arcade.js?v=20260826-become-social-agency-10' /tmp/dream-unity-live/index.html
          grep -q 'become-social-agency-10.txt' /tmp/dream-unity-live/arcade.js
          grep -q 'S10_PROFILES' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'S10_COMBINED_AXES' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'function s10SelectCombos' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'function s10SchedulePrewarm' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'SELF —' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'OTHER —' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'NON-PERFORMATIVE EMPATHY' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'AGENTIC SELF-AWARENESS' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'ALL SCENARIOS SOCIAL' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'NO REPEATED SOCIAL PROFILE' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          grep -q 'NO NETWORK WAIT' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' /tmp/dream-unity-live/arcade-parts/become-social-agency-10.txt
          sha256sum /tmp/dream-unity-live/index.html /tmp/dream-unity-live/styles.css /tmp/dream-unity-live/become.css /tmp/dream-unity-live/main.js /tmp/dream-unity-live/arcade.js /tmp/dream-unity-live/arcade-parts/*.txt > /tmp/live-checksums.txt

      - name: Record social-agency deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'become':{
              'scenario_source':'instant_social_agency_maximin_synthesis',
              'all_scenarios_social':True,
              'perspective_cycle':['self','other_multiple_models','outside_interaction','action','feedback_update'],
              'empathy_rule':'model_flexibility_without_mind_reading_agreement_or_self_erasure',
              'boundaries_preserved':True,
              'social_profile_count':40,
              'world_family_count':26,
              'social_novelty_axes':16,
              'world_novelty_axes':13,
              'combined_novelty_axes':29,
              'selection_objective':'joint_maximin_worst_case_distance',
              'same_world_family_allowed_within_session':False,
              'same_social_profile_allowed_within_session':False,
              'cross_session_world_memory':True,
              'cross_session_social_memory':True,
              'queue_prewarmed_before_start':True,
              'cloud_on_scenario_critical_path':False,
              'between_scenario_network_wait':False,
              'original_scenario_bank_used_as_fallback':False,
              'personal_transfer_text_stored_in_novelty_memory':False,
              'social_faculty_titles':[
                'SOCIAL EVIDENCE','SELF-LOCATION','RELATIONAL ATMOSPHERE','RELATIONAL ATTENTION',
                'PERSPECTIVE PLURALITY','OTHER-MIND MODELLING','EMOTIONAL DIFFERENTIATION',
                'SELF-SIGNAL AWARENESS','RELATIONAL AGENCY','NON-PERFORMATIVE EMPATHY',
                'AGENTIC SELF-AWARENESS','INDEPENDENT-MIND FIDELITY','MULTI-PERSPECTIVE INTEGRATION'
              ],
            },
            'sha256':Path('/tmp/live-checksums.txt').read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record social-agency Become deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
