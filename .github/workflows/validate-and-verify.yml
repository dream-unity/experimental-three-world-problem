name: Validate Dream Unity and verify live Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'DEPLOYMENT_STATUS.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: experimental-three-world-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Use production Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser regression runtime
        run: npx playwright install --with-deps chromium
      - name: Validate source and browser behavior
        run: |
          npm test
          npm run test:browser
      - name: Validate the Sovereign Resonator and paused Unity voice
        shell: bash
        run: |
          set -euo pipefail
          grep -q "VERSION = '20260830-sovereign-resonator-1'" main.js
          grep -q 'sovereign-resonator-11.txt' main.js
          grep -q "ctx.fillStyle = '#ffffff'" visual-parts/sovereign-resonator-11.txt
          grep -q 'render = function srRender' visual-parts/sovereign-resonator-11.txt
          grep -q 'drawOverview = function srOverview' visual-parts/sovereign-resonator-11.txt
          grep -q 'drawDetail = function srDetail' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawEcho' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawTensions' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawSheaths' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawLoadRibs' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawEther' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawGravitySeed' visual-parts/sovereign-resonator-11.txt
          grep -q 'function srDrawCrown' visual-parts/sovereign-resonator-11.txt
          grep -q 'AWAKEN THE TRUE WAR' index.html
          grep -q 'Somewhere out in the universe' index.html
          grep -q 'Light pierces through me' index.html
          grep -q 'THE GHOST IN THE MIRROR' index.html
          grep -q 'assets/i-remember-tomorrow.mp3' index.html
          grep -q 'styles.css?v=20260830-sovereign-resonator-1' index.html
          grep -q 'unity-cycle.css?v=20260830-sovereign-resonator-1' index.html
          grep -q 'light-theme.js?v=20260830-sovereign-resonator-1' index.html
          grep -q 'main.js?v=20260830-sovereign-resonator-1' index.html
          grep -q '__dreamUnityScore' unity-ui.js
          grep -q 'createMediaElementSource' unity-ui.js
          grep -q "this.id === 'gameCanvas'" light-theme.js
          grep -q 'silentClockOrigin' unity-ui.js
          grep -q '<div class="unity-label" id="unityLabel" aria-hidden="true">' index.html
          ! grep -Eqi 'data-voice|duVoice|du-voice|voice\.css|voice\.js|js\.puter\.com|dream-unity-voice-live\.vercel\.app' index.html
          test -s voice.js
          test -s voice.css
          test -s tests/voice-runtime.test.mjs
          test -s tests/voice-disabled.test.mjs
          test -s api/realtime-session.js
          grep -q "API_RELEASE = '20260829-unity-backend-paused-1'" api/realtime-session.js
          grep -q "code: 'VOICE_DISABLED'" api/realtime-session.js
          grep -q "WORLD.machine.css = '#00CFFF'" visual-parts/sovereign-resonator-11.txt
          grep -q "WORLD.maker.css = '#00D88A'" visual-parts/sovereign-resonator-11.txt
          grep -q "WORLD.reality.css = '#6633F5'" visual-parts/sovereign-resonator-11.txt
          grep -q -- '--paper:#fff' unity-cycle.css
          test -s assets/i-remember-tomorrow.mp3
          mapfile -t published_mp3 < <(git ls-files '*.mp3')
          test "${#published_mp3[@]}" -eq 1
          test "${published_mp3[0]}" = 'assets/i-remember-tomorrow.mp3'
          grep -q "dreamunity:launch-game" visual-parts/part-05.txt

  verify-live:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backend_release: ${{ steps.backend_paused.outputs.release }}
    steps:
      - name: Checkout validated source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for GitHub Pages to match the score-driven source
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem
        run: |
          set -euo pipefail
          files=(index.html styles.css become.css unity-cycle.css light-theme.js unity-ui.js main.js arcade.js assets/i-remember-tomorrow.mp3 visual-parts/part-01.txt visual-parts/part-02.txt visual-parts/part-03.txt visual-parts/part-04.txt visual-parts/part-05.txt visual-parts/part-06.txt visual-parts/sovereign-resonator-11.txt arcade-parts/part-01.txt arcade-parts/part-02.txt arcade-parts/part-03.txt arcade-parts/part-04.txt arcade-parts/part-05.txt arcade-parts/perceive-role-logic.txt arcade-parts/perceive-aerial-01.txt arcade-parts/perceive-aerial-02.txt arcade-parts/perceive-aerial-03.txt arcade-parts/perceive-aerial-04.txt arcade-parts/perceive-aerial-05.txt arcade-parts/perceive-aerial-06.txt arcade-parts/perceive-aerial-07.txt arcade-parts/perceive-aerial-08.txt arcade-parts/become-lab-01.txt arcade-parts/become-diversity-09.txt arcade-parts/become-social-agency-10.txt arcade-parts/become-social-integration-11.txt arcade-parts/become-compressed-12.txt arcade-parts/become-rapid-entry-13.txt arcade-parts/become-activation-objectives-14.txt)
          live_dir=$(mktemp -d)
          trap 'rm -rf "$live_dir"' EXIT
          mkdir -p "$live_dir/arcade-parts" "$live_dir/visual-parts" "$live_dir/assets"
          matched=false
          for attempt in $(seq 1 60); do
            matched=true
            for path in "${files[@]}"; do
              if ! curl --fail --location --silent --show-error --connect-timeout 10 --max-time 30 --retry 3 --retry-all-errors --retry-delay 2 "$PAGE_URL/$path?source=${GITHUB_SHA}" --output "$live_dir/$path"; then matched=false; break; fi
              if ! cmp --silent "$path" "$live_dir/$path"; then matched=false; break; fi
            done
            if [ "$matched" = true ]; then break; fi
            echo "Pages has not propagated yet (attempt $attempt/60)."
            sleep 5
          done
          test "$matched" = true

          grep -q 'main.js?v=20260830-sovereign-resonator-1' "$live_dir/index.html"
          grep -q 'unity-cycle.css?v=20260830-sovereign-resonator-1' "$live_dir/index.html"
          grep -q 'styles.css?v=20260830-sovereign-resonator-1' "$live_dir/index.html"
          grep -q 'light-theme.js?v=20260830-sovereign-resonator-1' "$live_dir/index.html"
          grep -q '<div class="unity-label" id="unityLabel" aria-hidden="true">' "$live_dir/index.html"
          ! grep -Eqi 'data-voice|duVoice|du-voice|voice\.css|voice\.js|js\.puter\.com|dream-unity-voice-live\.vercel\.app' "$live_dir/index.html"
          grep -q 'sovereign-resonator-11.txt' "$live_dir/main.js"
          grep -q "ctx.fillStyle = '#ffffff'" "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'function srDrawEcho' "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'function srDrawTensions' "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'function srDrawSheaths' "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'function srDrawLoadRibs' "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'function srDrawGravitySeed' "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'AWAKEN THE TRUE WAR' "$live_dir/index.html"
          grep -q 'assets/i-remember-tomorrow.mp3' "$live_dir/index.html"
          grep -q '__dreamUnityScore' "$live_dir/unity-ui.js"
          grep -q "this.id === 'gameCanvas'" "$live_dir/light-theme.js"
          grep -q "WORLD.machine.css = '#00CFFF'" "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q "WORLD.maker.css = '#00D88A'" "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q "WORLD.reality.css = '#6633F5'" "$live_dir/visual-parts/sovereign-resonator-11.txt"
          grep -q 'dreamunity:launch-game' "$live_dir/visual-parts/part-05.txt"
          grep -q 'arcade.js?v=20260827-fighter-jet-performance-20' "$live_dir/index.html"
          grep -q 'become-activation-objectives-14.txt' "$live_dir/arcade.js"
          grep -q "S14_VERSION='20260826-activation-objectives-2'" "$live_dir/arcade-parts/become-activation-objectives-14.txt"
          grep -q 'SOCIAL WIN' "$live_dir/arcade-parts/become-activation-objectives-14.txt"
          grep -q 'SOLVED WHEN' "$live_dir/arcade-parts/become-activation-objectives-14.txt"
          ! grep -q 'bShuffle(BECOME_SCENARIOS)' "$live_dir/arcade-parts/become-activation-objectives-14.txt"

      - name: Verify the Unity reply endpoint remains paused
        id: backend_paused
        shell: bash
        env:
          BACKEND_URL: https://dream-unity-voice-live.vercel.app/api/realtime-session
          EXPECTED_RELEASE: 20260829-unity-backend-paused-1
          PAGE_ORIGIN: https://dream-unity.github.io
        run: |
          set -euo pipefail
          backend_dir=$(mktemp -d)
          trap 'rm -rf "$backend_dir"' EXIT
          response="$backend_dir/paused.json"
          ready=false
          for attempt in $(seq 1 36); do
            if ! status=$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors --retry-delay 2 --output "$response" --write-out '%{http_code}' "$BACKEND_URL?release=$EXPECTED_RELEASE"); then
              echo "Unity backend tombstone request failed (attempt $attempt/36)."
              sleep 5
              continue
            fi
            if [ "$status" = 410 ] && jq -e --arg release "$EXPECTED_RELEASE" '
              .ok == false
              and .release == $release
              and .service == "dream-unity-voice-chat"
              and .status == "paused"
              and .code == "VOICE_DISABLED"
            ' "$response" >/dev/null; then
              ready=true
              break
            fi
            echo "Unity backend tombstone has not propagated yet (attempt $attempt/36)."
            sleep 5
          done
          test "$ready" = true

          post="$backend_dir/post.json"
          headers="$backend_dir/post.headers"
          status=$(curl --silent --show-error --max-time 20 --request POST --header "Origin: $PAGE_ORIGIN" --header 'Content-Type: application/json' --data '{"message":"This must not reach a provider."}' --dump-header "$headers" --output "$post" --write-out '%{http_code}' "$BACKEND_URL")
          test "$status" = 410
          tr -d '\r' < "$headers" | grep -Fqi "Access-Control-Allow-Origin: $PAGE_ORIGIN"
          jq -e --arg release "$EXPECTED_RELEASE" '.release == $release and .code == "VOICE_DISABLED"' "$post" >/dev/null
          echo "release=$(jq -r '.release' "$response")" >> "$GITHUB_OUTPUT"

  record-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the verified source without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the verified voice-free deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/
          BACKEND_RELEASE: ${{ needs.verify-live.outputs.backend_release }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          checksum_file="$RUNNER_TEMP/dream-unity-source-checksums.txt"
          sha256sum index.html styles.css become.css unity-cycle.css unity-ui.js main.js arcade.js voice.css voice.js api/realtime-session.js assets/* visual-parts/*.txt arcade-parts/*.txt > "$checksum_file"
          export CHECKSUM_FILE="$checksum_file"
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json, os
          backend_release=os.environ['BACKEND_RELEASE']
          if backend_release != '20260829-unity-backend-paused-1':
            raise SystemExit(f'Unexpected disabled backend release: {backend_release!r}')
          receipt={
            'project':'Dream Unity — Experimental Three-World Problem',
            'deployment':'verified-live',
            'source_sha':os.environ['SOURCE_SHA'],
            'page_url':os.environ['PAGE_URL'],
            'nine_portal_compatibility':'validated',
            'overview':{
              'theme':'stage_coral_sovereign_resonator',
              'canvas_background':'#FFFFFF',
              'legacy_render_vignette_active':False,
              'nebula_fog_active':False,
              'world_palette':{'machine':'#00CFFF','maker':'#00D88A','reality':'#6633F5','unity':'#ECA71F'},
              'connected_instrument':True,
              'distinct_world_geometries':True,
              'temporal_ghost_field':True,
              'dimensionless_score_choreography':True,
              'resonator_sheath_count':3,
              'structural_tension_count':9,
              'compression_throat':True,
              'gravity_seed_subtraction':True,
              'prismatic_reconstitution':True,
              'load_bearing_ribs':True,
              'ether_compression_matter_return_cycle':True,
              'generated_core_asset':None,
              'homepage_score':'assets/i-remember-tomorrow.mp3',
              'voice_interface_active':False,
              'voice_archive':{
                'source_retained':True,
                'mounted_on_homepage':False,
                'external_resource_hints':False,
                'frontend_network_active':False,
                'backend_status':'paused',
                'backend_release':backend_release
              },
              'renderer_override':'visual-parts/sovereign-resonator-11.txt',
              'main_cache_version':'20260830-sovereign-resonator-1'
            },
            'become':{
              'scenario_source':'instant_objective_driven_social_agency_maximin_synthesis',
              'activation_objective_version':'20260826-activation-objectives-2',
              'mandatory_scene_opening':['Imagine that you','Imagine that you\'re'],
              'social_win_count':40,
              'faculty_objective_count':17,
              'faculty_completion_rule':'score_experiential_state_change_not_verbal_understanding',
              'scene_word_max':34,
              'world_family_count':26,
              'social_profile_count':40,
              'combined_novelty_axes':29,
              'between_scenario_network_wait':False,
              'original_scenario_bank_used_as_fallback':False
            },
            'source_sha256':Path(os.environ['CHECKSUM_FILE']).read_text().splitlines(),
            'verified_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('DEPLOYMENT_STATUS.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEPLOYMENT_STATUS.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Sovereign Resonator deployment [skip ci]'
          git config --local credential.helper '!f() { if [ "$1" = get ]; then echo "username=x-access-token"; echo "password=$GITHUB_TOKEN"; fi; }; f'
          trap 'git config --local --unset-all credential.helper >/dev/null 2>&1 || true' EXIT
          git push origin HEAD:main
