name: Verify God's Eye View spatial anchoring

on:
  push:
    branches: [main]
    paths:
      - 'gods-eye-view/**'
      - '.github/workflows/gev-spatial-anchoring.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gev-spatial-anchoring-main
  cancel-in-progress: true

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Use Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for spatial deployment
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/gods-eye-view/
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 48); do
            html=$(curl --fail --location --silent --show-error --connect-timeout 8 --max-time 20 \
              "$PAGE_URL?spatial=${GITHUB_SHA}" || true)
            if grep -q '20260831-earth-fixed-1' <<<"$html" \
              && grep -q 'data-adapter.js?v=20260831-earth-fixed-2' <<<"$html"; then
              ready=true
              break
            fi
            echo "Spatial page not propagated yet ($attempt/48)."
            sleep 5
          done
          test "$ready" = true
      - name: Verify live radio remains Earth-fixed
        shell: bash
        env:
          PAGE_URL: https://dream-unity.github.io/experimental-three-world-problem/gods-eye-view/
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const errors = [];
            page.on('pageerror', error => errors.push(String(error)));
            await page.goto(`${process.env.PAGE_URL}?spatial=${process.env.GITHUB_SHA}`, {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            await page.waitForFunction(() => (
              window.__dreamUnityGeoAnchoring?.version === '20260831-earth-fixed-1'
              && window.__dreamUnityDataAdapter?.version === '20260831-earth-fixed-2'
            ), null, { timeout: 30000 });

            if (await page.locator('iframe').count()) {
              throw new Error('God’s Eye View must remain native, not iframe-hosted');
            }

            const adapter = await page.evaluate(() => window.__dreamUnityDataAdapter);
            if (adapter.radio !== 'direct-radio-browser') {
              throw new Error(`Radio must use direct Radio Browser coordinates; got ${adapter.radio}`);
            }

            await page.locator('[data-layer="radio"]').click();
            await page.waitForFunction(() => {
              const count = Number(document.getElementById('count-radio')?.textContent || 0);
              return count >= 100 && window.__dreamUnityGeoAnchoring?.patchedRadio === count;
            }, null, { timeout: 60000 });

            const result = await page.evaluate(() => ({
              adapter: window.__dreamUnityDataAdapter,
              anchoring: window.__dreamUnityGeoAnchoring,
              count: Number(document.getElementById('count-radio')?.textContent || 0),
              status: document.getElementById('statusText')?.textContent || '',
            }));

            if (result.anchoring.patchedRadio !== result.count) {
              throw new Error(`Not every radio marker was depth-tested: ${result.anchoring.patchedRadio}/${result.count}`);
            }
            if (result.anchoring.patchedPoints < result.anchoring.patchedRadio) {
              throw new Error('Spatial instrumentation count is internally inconsistent');
            }
            if (errors.length) throw new Error(`Page errors: ${errors.join(' | ')}`);

            console.log(JSON.stringify(result, null, 2));
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
