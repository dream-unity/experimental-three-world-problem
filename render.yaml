services:
  - type: web
    name: gods-eye-view-live
    runtime: docker
    plan: free
    region: singapore
    branch: cloudrun-gods-eye-view
    rootDir: cloudrun-gods-eye-view
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: OPENSKY_AUTH_MODE
        value: anon
      - key: GEV_LOW_MEMORY
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=352
      - key: NODE_ENV
        value: development
